[package]
name = "singz-gpui-player"
version = "0.1.0"
edition = "2024"
publish = false

[features]
ui-tests = []

[dependencies]
gpui-kit = "=0.9.0"
# Enable native offscreen rendering without gpui-kit optional fast-backend features.
gpui-test-platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["test-support"] }
singz-uikit = { path = "../../../singz-ui/gpui" }
anyhow = "1"
serde_json = "1"
sha2 = "=0.11.1"
resvg = "=0.46.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }
core-foundation-sys = "=0.8.7"
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.11", features = ["runtime_shaders"] }

[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre = { path = "vendor/gpui-pre" }
