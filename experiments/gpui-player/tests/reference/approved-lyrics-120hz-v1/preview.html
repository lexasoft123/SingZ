<script>
(() => {
  const root = document.getElementById('highlight-comparison-fixed');
  const frames = JSON.parse(root.querySelector('[data-frames]').textContent);
  const slider = root.querySelector('input');
  const label = root.querySelector('[data-label]');
  const beforeImage = root.querySelector('[data-before]');
  const afterImage = root.querySelector('[data-after]');
  function show(value) {
    const index = Math.max(0, Math.min(frames.length - 1, Number(value)));
    slider.value = String(index);
    beforeImage.src = 'data:image/jpeg;base64,' + frames[index][0];
    afterImage.src = 'data:image/jpeg;base64,' + frames[index][1];
    label.textContent = `Frame ${index} / 160 · ${(63.85 + index / 120).toFixed(5)} s`;
  }
  slider.addEventListener('input', () => show(slider.value));
  root.querySelector('[data-action="previous"]').addEventListener('click', () => show(Number(slider.value) - 1));
  root.querySelector('[data-action="next"]').addEventListener('click', () => show(Number(slider.value) + 1));
  show(60);
})();
</script>
