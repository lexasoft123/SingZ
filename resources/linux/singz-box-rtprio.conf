# Opt-in real-time priority ceiling for the SingZ Box audio service.
# Install for the one appliance user only (replace 1000 with its UID):
#   /etc/systemd/system/user@1000.service.d/singz-box-rtprio.conf
# then: systemctl daemon-reload && systemctl restart user@1000.service
# soft 0 keeps every other user process at normal priority; only
# singz-box-audio.service raises its own soft limit (LimitRTPRIO=20).
[Service]
LimitRTPRIO=0:20
