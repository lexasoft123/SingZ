<script>
(() => {
  const root = document.getElementById('singz-torrent-preview');
  const releases = [
    { id: 'discography', artist: 'Кино', title: 'Дискография', year: '1982–1990', format: 'FLAC', quality: 'Lossless · 16-bit / 44.1 kHz', total: '3.2 GB', seeds: 328, album: '1988 · Группа крови', mb: 32.4 },
    { id: 'album', artist: 'Кино', title: 'Группа крови', year: '1988', format: 'FLAC', quality: 'Lossless · 16-bit / 44.1 kHz', total: '287 MB', seeds: 210, album: 'Группа крови', mb: 31.8 },
    { id: 'mp3', artist: 'Кино', title: 'Группа крови', year: '1988', format: 'MP3', quality: '320 kbps', total: '103 MB', seeds: 96, album: 'Группа крови', mb: 9.4 },
    { id: 'live', artist: 'Кино', title: 'Последний концерт', year: '1990', format: 'FLAC', quality: 'Live · 16-bit / 44.1 kHz', total: '436 MB', seeds: 38, album: 'Live · 1990', mb: 35.2 },
    { id: 'waiting', artist: 'Кино', title: 'Группа крови · Винил', year: '1988', format: 'FLAC', quality: 'Vinyl rip · 24-bit / 96 kHz', total: '921 MB', seeds: 0, album: 'Группа крови · Vinyl', mb: 89.6 }
  ].sort((a,b) => b.seeds - a.seeds);
  const songs = [
    { title: 'Группа крови', duration: '4:45', scale: 1 },
    { title: 'Закрой за мной дверь, я ухожу', duration: '4:15', scale: .88 },
    { title: 'Война', duration: '4:05', scale: .86 },
    { title: 'Спокойная ночь', duration: '6:07', scale: 1.3 },
    { title: 'Мама, мы все тяжело больны', duration: '3:57', scale: .81 },
    { title: 'Прохожий', duration: '3:42', scale: .78 }
  ];
  const states = {};
  const timers = new Map();
  const writerID = Date.now().toString(36) + Math.random().toString(36).slice(2);
  let saved = window.openai && window.openai.widgetState;
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = text => '<span aria-hidden="true">' + text + '</span>';
  const releaseOf = s => releases.find(r => r.id === s.release);
  const fileMB = s => Number((releaseOf(s).mb * songs[s.track].scale).toFixed(1));
  const searchMatches = (r,q) => {
    const haystack = (r.artist + ' ' + r.title + ' ' + r.year + ' ' + r.format + ' ' + songs.map(t=>t.title).join(' ')).toLocaleLowerCase();
    return q.toLocaleLowerCase().split(/\s+/).filter(Boolean).every(word => haystack.includes(word));
  };
  function restore(platform) {
    const raw = saved && saved.privateContent && saved.privateContent.platforms && saved.privateContent.platforms[platform];
    const s = { route: 'search', connected: true, query: 'Кино Группа крови', release: null, track: null, filter: '', progress: 0, paused: false, added: false, title: '', artist: 'Кино' };
    if (!raw || typeof raw !== 'object') return s;
    if (typeof raw.query === 'string') s.query = raw.query.slice(0,120);
    if (releases.some(r=>r.id === raw.release)) s.release = raw.release;
    if (Number.isInteger(raw.track) && songs[raw.track]) s.track = raw.track;
    if (['search','files','download','details','added','library','account'].includes(raw.route)) s.route = raw.route;
    if (!s.release && ['files','download','details','added'].includes(s.route)) s.route = 'search';
    if (s.track === null && ['download','details','added'].includes(s.route)) s.route = 'files';
    s.connected = raw.connected !== false; s.added = raw.added === true;
    s.progress = Math.max(0,Math.min(100,Number(raw.progress)||0));
    s.paused = s.route === 'download' && s.progress < 100;
    s.title = typeof raw.title === 'string' ? raw.title.slice(0,200) : '';
    s.artist = typeof raw.artist === 'string' ? raw.artist.slice(0,200) : 'Кино';
    return s;
  }
  function save(platform) {
    if (!window.openai || !window.openai.setWidgetState) return;
    const s = states[platform];
    const platforms = Object.fromEntries(Object.entries(states).map(([name,state]) => [name,{
      route:state.route,query:state.query,release:state.release,track:state.track,progress:state.progress,
      connected:state.connected,added:state.added,title:state.title,artist:state.artist
    }]));
    window.openai.setWidgetState({
      modelContent: { prototype:'SingZ RuTracker', platform, screen:s.route, order:'seeders descending', release:s.release,
        song:s.track === null ? null : songs[s.track].title },
      privateContent: { platforms, writerID }
    }).catch(()=>{});
  }
  function stopTimer(platform) {
    if (timers.has(platform)) clearInterval(timers.get(platform));
    timers.delete(platform);
  }
  function chrome(platform,s,content) {
    const desktop = platform === 'Desktop';
    const account = '<button class="sz-account cursor-interaction" data-action="account" aria-label="RuTracker account">' +
      (s.connected ? '<span class="sz-dot"></span>Demo account' : 'Sign in') + '</button>';
    if (desktop) return '<div class="sz-desktop-top"><span class="sz-window-dots" aria-hidden="true">● ● ●</span><span class="sz-wordmark">Sing<em>Z</em></span><span class="sz-top-caption">Your next song is out there.</span></div>' +
      '<div class="sz-desktop-body"><aside class="sz-sidebar"><div class="sz-wordmark">Sing<em>Z</em></div><nav class="sz-nav" aria-label="SingZ navigation">' +
      '<button class="cursor-interaction ' + (s.route === 'library' ? 'sz-active' : '') + '" data-action="library">♫ &nbsp; Your library</button>' +
      '<button class="cursor-interaction ' + (s.route !== 'library' ? 'sz-active' : '') + '" data-action="search">＋ &nbsp; Add song</button></nav>' +
      '<div class="sz-sidebar-foot">A song. Your voice.<br>A little more practice.</div></aside><main class="sz-main">' + content(account) + '</main></div>';
    return '<div class="sz-status"><span>9:41</span><span class="sz-status-right" aria-label="Full signal, Wi-Fi, battery 100 percent">▮▮▮ &nbsp; Wi-Fi &nbsp; 100%</span></div>' +
      '<div class="sz-phone-nav"><button class="sz-back cursor-interaction" data-action="back">' + (platform === 'iOS' ? '‹ ' : '← ') + (s.route === 'search' ? 'Library' : 'Back') + '</button><strong>Add song</strong>' +
      account + '</div><main class="sz-main">' + content('') + '</main><div class="sz-homebar" aria-hidden="true"></div>';
  }
  function heading(eyebrow,title,subtitle,account) {
    return '<header class="sz-heading"><div><span class="sz-eyebrow">' + eyebrow + '</span><h1>' + title + '</h1>' +
      (subtitle ? '<p>' + subtitle + '</p>' : '') + '</div>' + account + '</header>';
  }
  function resultsHTML(s) {
    const rows = releases.filter(r=>searchMatches(r,s.query));
    return '<div class="sz-list-meta"><span>' + rows.length + ' releases</span><strong>↓ Most seeders first</strong></div>' +
      (rows.length ? rows.map(r => '<button class="sz-release cursor-interaction ' + (s.release === r.id ? 'sz-selected ' : '') + (r.seeds === 0 ? 'sz-zero' : '') +
      '" data-action="release" data-release="' + r.id + '" aria-pressed="' + (s.release === r.id) + '"><span><span class="sz-release-title">' +
      esc(r.artist + ' · ' + r.title) + '</span><span class="sz-release-desc">' + esc(r.year) + ' · ' + esc(r.total) +
      '</span><span class="sz-release-desc"><span class="sz-release-format">' + r.format + '</span>' + esc(r.quality.replace('Lossless · ','')) +
      '</span></span><span class="sz-seeders">' + r.seeds + '<small>seeders</small></span></button>').join('') :
      '<div class="sz-empty">No releases found.<br><button class="sz-link cursor-interaction" data-action="reset-query">Try “Кино Группа крови”</button></div>') +
      '<p class="sz-results-foot">Choose a release, then pick the song inside.</p>';
  }
  function tracksHTML(platform,s) {
    const r = releaseOf(s);
    const list = songs.map((song,i)=>({song,i})).filter(({song})=>song.title.toLocaleLowerCase().includes(s.filter.toLocaleLowerCase()));
    return '<div class="sz-detail-head"><span class="sz-eyebrow">Choose one song</span><h2>' + esc(r.artist + ' · ' + r.title) +
      '</h2><p>' + esc(r.format + ' · ' + r.total + ' release') + ' · <span style="color:var(--sz-green)">' + r.seeds + ' seeders</span></p></div>' +
      '<label><span class="sz-eyebrow" style="margin-bottom:5px">Find a song in this release</span><input class="sz-file-search" data-input="filter" aria-label="Find a song in this release" placeholder="Song title" value="' + esc(s.filter) + '"></label>' +
      '<div class="sz-folder">' + icon('↳') + ' ' + esc(r.album) + ' /</div><div class="sz-track-list">' + trackRows(platform,s,list) + '</div>' +
      selectionHTML(s);
  }
  function trackRows(platform,s,list) {
    const r = releaseOf(s);
    return list.length ? list.map(({song,i})=>'<label class="sz-track cursor-interaction ' + (s.track === i ? 'sz-picked' : '') + '"><input type="radio" name="song-' + platform +
      '" value="' + i + '" data-input="track" ' + (s.track === i ? 'checked' : '') + '><span class="sz-track-title">' +
      esc(song.title) + '<small>' + String(i+1).padStart(2,'0') + ' · ' + song.duration + ' · ' + r.format +
      '</small></span><span class="sz-track-size">' + (r.mb * song.scale).toFixed(1) + ' MB</span></label>').join('') :
      '<p class="sz-empty">No songs match this title.</p>';
  }
  function selectionHTML(s) {
    return '<div class="sz-selection"><div class="sz-selection-line"><span>' + (s.track === null ? 'Select one song' : '1 song selected') +
      '</span><strong>' + (s.track === null ? '—' : fileMB(s) + ' MB') + '</strong></div><p>' +
      (s.track === null ? 'The rest of the release stays unselected.' : 'Only this song. The full release is ' + releaseOf(s).total + '.') +
      '</p><button class="sz-primary cursor-interaction" data-action="download" ' + (s.track === null ? 'disabled' : '') + '>Download song' +
      (s.track === null ? '' : ' · ' + fileMB(s) + ' MB') + '</button></div>';
  }
  function searchHTML(platform,s,account) {
    const desktop = platform === 'Desktop';
    const detail = s.release ? tracksHTML(platform,s) : '<div class="sz-detail-empty"><span class="sz-empty-symbol" aria-hidden="true">↳</span><h2>An album, just your song.</h2><p>Choose a release on the left. Then select the track you want to sing.</p></div>';
    return heading('Add song / RuTracker','Find your next song','Search by artist or song title.',account) +
      '<form class="sz-search" data-form="search"><span aria-hidden="true">⌕</span><input aria-label="Search RuTracker" data-input="query" value="' + esc(s.query) + '" placeholder="Artist or song" autocomplete="off"><button class="cursor-interaction" type="submit" data-action="submit">Search</button></form>' +
      '<div class="sz-split"><section class="sz-results" aria-label="Releases sorted by seeders descending">' + resultsHTML(s) +
      '</section>' + (desktop ? '<section class="sz-detail" aria-label="Song selection">' + detail + '</section>' : '') + '</div>';
  }
  function downloadHTML(s,account) {
    const r = releaseOf(s), song = songs[s.track], complete = s.progress >= 100, waiting = r.seeds === 0;
    const status = complete ? 'Song downloaded' : waiting ? 'Waiting for seeders' : s.paused ? 'Download paused' : 'Downloading your song';
    return heading('Add song / ' + (complete ? 'Ready' : 'Download'),status,'',account) +
      '<section class="sz-download">' + (complete ? '<div class="sz-check" aria-hidden="true">✓</div>' : '<div class="sz-art" aria-hidden="true">♫</div>') +
      '<span class="sz-eyebrow">' + esc(r.format) + ' · ' + fileMB(s) + ' MB</span><div class="sz-download-title"><h2>' + esc(song.title) +
      '</h2><p>' + esc(r.artist + ' · ' + r.album) + '</p></div>' +
      '<div class="sz-progress-label"><strong data-progress-number>' + Math.floor(s.progress) + '%</strong><span data-progress-state>' +
      (complete ? 'Verified and ready' : waiting ? 'No seeders available' : s.paused ? 'Paused' : 'About ' + Math.max(1,Math.ceil((100-s.progress)/12)) + ' seconds left') +
      '</span></div><div class="sz-meter" role="progressbar" aria-label="Song download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.floor(s.progress) +
      '"><div class="sz-meter-fill" style="width:' + s.progress + '%"></div></div><div class="sz-download-stats"><span data-download-bytes>' +
      (fileMB(s)*s.progress/100).toFixed(1) + ' / ' + fileMB(s) + ' MB</span><span data-download-speed>' + (complete ? 'Complete' : waiting || s.paused ? '0 MB/s' : '3.9 MB/s') +
      '</span></div><div class="sz-notice">' +
      (complete ? 'Next, confirm the song details and add it to your library.' : waiting ? 'This release has no seeders right now. You can wait or choose another release.' :
      'Downloading only this song. The rest of the ' + r.total + ' release is unselected.') + '</div><div class="sz-download-actions">' +
      (complete ? '<button class="sz-primary cursor-interaction" data-action="details">Continue to Add song →</button>' :
      '<button class="sz-primary cursor-interaction" data-action="' + (waiting ? 'choose-another' : 'pause') + '">' + (waiting ? 'Choose another release' : s.paused ? 'Resume download' : 'Pause download') + '</button>') +
      '<button class="sz-link cursor-interaction" data-action="cancel">' + (complete ? 'Back to songs' : 'Cancel download') + '</button></div></section>';
  }
  function detailsHTML(s,account) {
    return heading('Add song / Song details','Make it yours','Confirm the details before adding the song.',account) +
      '<section class="sz-download"><div class="sz-source-info"><span style="color:var(--sz-green)" aria-hidden="true">✓</span><div><strong>' +
      esc(songs[s.track].title + '.' + releaseOf(s).format.toLowerCase()) + '</strong><small>Downloaded from RuTracker · ' + fileMB(s) + ' MB</small></div></div>' +
      '<form class="sz-form" data-form="details"><label class="sz-field">Song title<input data-input="title" aria-label="Song title" value="' +
      esc(s.title || songs[s.track].title) + '" required maxlength="200"></label><label class="sz-field">Artist<input data-input="artist" aria-label="Artist" value="' +
      esc(s.artist) + '" required maxlength="200"></label><div class="sz-notice">The song continues through SingZ’s usual Add song flow for lyrics and preparation.</div><button class="sz-primary cursor-interaction" type="submit" data-action="submit">Add song</button></form></section>';
  }
  function libraryHTML(s,account) {
    return heading('Your music','Your library','One more song to make your own.',account) +
      '<button class="sz-primary sz-inline-cta cursor-interaction" data-action="search">＋ Add song</button><div class="sz-library">' +
      (s.added ? '<div class="sz-library-row"><div class="sz-art" aria-hidden="true">♫</div><div><h3>' + esc(s.title || songs[s.track].title) +
      '</h3><p>' + esc(s.artist) + ' · Original audio</p></div><span class="sz-new">Just added</span></div>' : '') +
      '<div class="sz-library-row"><div class="sz-art" aria-hidden="true">♫</div><div><h3>Sing with me</h3><p>SingZ · Sample song</p></div></div></div>';
  }
  function accountHTML(s) {
    return '<section class="sz-account-card"><button class="sz-back sz-route-back cursor-interaction" data-action="search">← Back to search</button><span class="sz-eyebrow">RuTracker account</span><h1>' +
      (s.connected ? 'Connected for the demo.' : 'Bring your account.') + '</h1><p>' +
      (s.connected ? 'You’re exploring with a sample session. No account is connected to RuTracker.' : 'Sign in to search releases and choose the song you want.') +
      '</p><form class="sz-form" data-form="account"><label class="sz-field">Username<input aria-label="RuTracker username" value="demo_singer" autocomplete="off" maxlength="80"></label><label class="sz-field">Password<input aria-label="Demo password" type="password" placeholder="Demo only — don’t use your real password" autocomplete="off"></label><p class="sz-notice">Prototype only. These fields stay on this screen and are never sent or saved.</p><button class="sz-primary cursor-interaction" type="submit" data-action="submit">Continue with demo account</button>' +
      (s.connected ? '<button class="sz-link cursor-interaction" type="button" data-action="signout">Sign out of demo</button>' : '') + '</form></section>';
  }
  function render(platform) {
    const shell = root.querySelector('[data-platform="' + platform + '"]'), s = states[platform];
    shell.innerHTML = chrome(platform,s,account => {
      if (s.route === 'account') return accountHTML(s);
      if (s.route === 'library') return libraryHTML(s,account);
      if (s.route === 'details') return detailsHTML(s,account);
      if (s.route === 'added') return heading('Your library','Ready for your next rehearsal.','',account) +
        '<section class="sz-download"><div class="sz-check" aria-hidden="true">✓</div><h2>' + esc(s.title || songs[s.track].title) +
        '</h2><p style="color:var(--sz-dim);margin-top:9px">Added to your library · ' + esc(s.artist) + '</p><div class="sz-download-actions"><button class="sz-primary cursor-interaction" data-action="library">Go to library</button><button class="sz-link cursor-interaction" data-action="search">Find another song</button></div></section>';
      if (s.route === 'download') return downloadHTML(s,account);
      if (s.route === 'files') return '<section class="sz-detail" aria-label="Song selection">' + tracksHTML(platform,s) + '</section>';
      return searchHTML(platform,s,account);
    });
  }
  function focusHeading(platform) {
    const shell = root.querySelector('[data-platform="' + platform + '"]');
    const main = shell.querySelector('main');
    main.setAttribute('aria-live','polite');
  }
  function startTimer(platform) {
    stopTimer(platform);
    const s = states[platform];
    if (s.route !== 'download' || s.paused || s.progress >= 100 || releaseOf(s).seeds === 0) return;
    timers.set(platform,setInterval(() => {
      if (!root.isConnected) { stopTimer(platform); return; }
      if (root.closest('[hidden]') || document.hidden) return;
      const shell = root.querySelector('[data-platform="' + platform + '"]');
      if (shell.closest('[hidden]')) return;
      s.progress = Math.min(100,s.progress+6);
      if (s.progress >= 100) { stopTimer(platform); render(platform); save(platform); return; }
      shell.querySelector('[data-progress-number]').textContent = Math.floor(s.progress) + '%';
      shell.querySelector('[data-progress-state]').textContent = 'About ' + Math.max(1,Math.ceil((100-s.progress)/12)) + ' seconds left';
      shell.querySelector('.sz-meter').setAttribute('aria-valuenow',Math.floor(s.progress));
      shell.querySelector('.sz-meter-fill').style.width = s.progress + '%';
      shell.querySelector('[data-download-bytes]').textContent = (fileMB(s)*s.progress/100).toFixed(1) + ' / ' + fileMB(s) + ' MB';
    },500));
  }
  root.addEventListener('click',event => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const shell = button.closest('[data-platform]'), platform = shell.dataset.platform, s = states[platform];
    const action = button.dataset.action;
    if (action === 'submit') { event.preventDefault(); submitForm(button.closest('[data-form]')); return; }
    if (action === 'account') { stopTimer(platform); s.route = 'account'; }
    if (action === 'signout') { s.connected = false; s.route = 'account'; }
    if (action === 'search' || action === 'choose-another') { stopTimer(platform); s.route = s.connected ? 'search' : 'account'; if (action === 'choose-another') { s.release = null; s.track = null; } }
    if (action === 'library') { stopTimer(platform); s.route = 'library'; }
    if (action === 'back') {
      stopTimer(platform);
      s.route = s.route === 'search' ? 'library' : s.route === 'download' || s.route === 'details' ? 'files' : 'search';
    }
    if (action === 'release') {
      if (!s.connected) s.route = 'account';
      else { s.release = button.dataset.release; s.track = null; s.filter = ''; if (platform !== 'Desktop') s.route = 'files'; }
    }
    if (action === 'reset-query') s.query = 'Кино Группа крови';
    if (action === 'download') {
      s.progress = 0; s.paused = false; s.route = 'download'; s.title = songs[s.track].title; s.artist = releaseOf(s).artist;
    }
    if (action === 'pause') { s.paused = !s.paused; if (s.paused) stopTimer(platform); }
    if (action === 'cancel') { stopTimer(platform); s.progress = 0; s.paused = false; s.route = platform === 'Desktop' ? 'search' : 'files'; }
    if (action === 'details') { s.route = 'details'; }
    render(platform); focusHeading(platform); save(platform); startTimer(platform);
  });
  function submitForm(form) {
    if (!form) return;
    const platform = form.closest('[data-platform]').dataset.platform, s = states[platform];
    if (form.dataset.form === 'search') {
      s.query = form.querySelector('[data-input="query"]').value.trim().slice(0,120);
      s.release = null; s.track = null;
    }
    if (form.dataset.form === 'account') { s.connected = true; s.route = 'search'; }
    if (form.dataset.form === 'details') {
      const title = form.querySelector('[data-input="title"]').value.trim();
      const artist = form.querySelector('[data-input="artist"]').value.trim();
      if (!title || !artist) return;
      s.title = title; s.artist = artist; s.added = true; s.route = 'added';
    }
    render(platform); focusHeading(platform); save(platform);
  }
  root.addEventListener('submit',event => {
    event.preventDefault();
    submitForm(event.target.closest('[data-form]'));
  });
  root.addEventListener('keydown',event => {
    if (event.key !== 'Enter' || event.isComposing || event.target.tagName !== 'INPUT') return;
    const form = event.target.closest('[data-form]');
    if (!form) return;
    event.preventDefault();
    submitForm(form);
  });
  root.addEventListener('input',event => {
    if (event.target.dataset.input !== 'filter') return;
    const platform = event.target.closest('[data-platform]').dataset.platform, s = states[platform];
    s.filter = event.target.value;
    const list = songs.map((song,i)=>({song,i})).filter(({song})=>song.title.toLocaleLowerCase().includes(s.filter.toLocaleLowerCase()));
    event.target.closest('.sz-detail').querySelector('.sz-track-list').innerHTML = trackRows(platform,s,list);
  });
  root.addEventListener('change',event => {
    if (event.target.dataset.input !== 'track') return;
    const platform = event.target.closest('[data-platform]').dataset.platform, s = states[platform];
    s.track = Number(event.target.value);
    const detail = event.target.closest('.sz-detail');
    detail.querySelectorAll('.sz-track').forEach(row=>row.classList.toggle('sz-picked',row.querySelector('input').checked));
    detail.querySelector('.sz-selection').outerHTML = selectionHTML(s);
    save(platform);
  });
  ['Desktop','iOS','Android'].forEach(platform => { states[platform] = restore(platform); render(platform); });
  window.addEventListener('openai:set_globals',event => {
    if (!event.detail || !event.detail.globals || !event.detail.globals.widgetState) return;
    if (event.detail.globals.widgetState.privateContent && event.detail.globals.widgetState.privateContent.writerID === writerID) return;
    saved = event.detail.globals.widgetState;
    ['Desktop','iOS','Android'].forEach(platform=>{ stopTimer(platform); states[platform] = restore(platform); render(platform); });
  });
  if (globalThis.Tweak) {
    root.querySelectorAll('[data-platform]').forEach(shell=>{
      const design = { compact: false };
      const tweak = new Tweak({ container:shell, onChange:()=>{ shell.style.setProperty('--sz-row-padding',design.compact?'11px':'15px'); } });
      tweak.addToggle(design,'compact',{label:'Compact release rows'});
    });
  }
})();
</script>
