extends: electron-builder.yml
appId: com.lexasoft.singz.box
productName: singz-box
extraMetadata:
  productName: SingZ Box
  name: singz-box
  singzProduct: box
  desktopName: singz-box.desktop
directories:
  output: dist/box
files:
  - '!electron-builder.box.yml'
artifactName: SingZ-Box-${version}-linux-${arch}.${ext}
extraResources:
  - from: resources/linux
    to: box-audio
publish: null
linux:
  executableName: singz-box
  desktop:
    entry:
      Name: SingZ Box
deb:
  packageName: singz-box
  depends:
    - python3
    - fonts-noto-cjk
