name: Shared mobile build caches
description: Restore portable compiler, dependency, Metro and validated native caches
inputs:
  platform:
    description: ios or android
    required: true
  archive-cache:
    description: Restore signed iOS native archives
    default: 'false'
outputs:
  state:
    description: Exact cache paths and save keys for the finalizer
    value: ${{ steps.record.outputs.state }}
runs:
  using: composite
  steps:
    - name: Install compiler cache and identify toolchain
      id: paths
      shell: bash
      env:
        CACHE_PLATFORM: ${{ inputs.platform }}
        CACHE_ARCHIVES: ${{ inputs.archive-cache }}
        CACHE_DEPS: ${{ hashFiles('mobile/package-lock.json', 'mobile/ios/Podfile.lock', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
        CACHE_SOURCES: ${{ hashFiles('package*.json', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'scripts/**', 'zcore/**', 'zdsp/**', 'native/**', 'third_party/**', 'assets/pitch/**', 'mobile/ios/**', 'mobile/native/**', 'mobile/scripts/**', 'mobile/android/**', 'mobile/src/specs/**', 'mobile/*.js', 'mobile/package.json', 'tests/native/**', 'tools/native/**', '.github/actions/**', '.github/workflows/ios*.yml', '.github/workflows/android.yml') }}
        CACHE_METRO_SOURCES: ${{ hashFiles('mobile/package-lock.json', 'mobile/*.js', 'mobile/*.tsx', 'mobile/src/**', 'src/shared/**', 'mobile/scripts/**') }}
      run: |
        set -euo pipefail
        case "$CACHE_PLATFORM" in
          ios)
            command -v ccache >/dev/null || brew install ccache
            toolchain=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-build-version; } | shasum -a 256 | cut -c1-16)
            ;;
          android)
            command -v ccache >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq ccache; }
            toolchain=ndk-27.1.12297006
            ;;
          *) echo "Unsupported platform: $CACHE_PLATFORM" >&2; exit 1 ;;
        esac
        CACHE_TOOLCHAIN="$toolchain" node scripts/ci-build-cache.cjs setup

    # Restore-only actions allow saving completed work after a later upload fails.
    # Unique run/attempt keys let mutable stores keep accumulating new entries.
    - name: Restore compiler objects
      id: compiler
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.compiler-path }}
        key: ${{ steps.paths.outputs.compiler-key }}
        restore-keys: ${{ steps.paths.outputs.compiler-restore }}
    - name: Restore Gradle dependencies and task outputs
      id: gradle
      if: inputs.platform == 'android'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.gradle-path }}
        key: ${{ steps.paths.outputs.gradle-key }}
        restore-keys: ${{ steps.paths.outputs.gradle-restore }}
    - name: Restore audio downloads
      id: audio
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.audio-path }}
        key: ${{ steps.paths.outputs.audio-key }}
    - name: Restore CocoaPods and React Native downloads
      id: pods
      if: inputs.platform == 'ios'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.pods-path }}
        key: ${{ steps.paths.outputs.pods-key }}
    - name: Restore Metro transforms
      id: metro
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.metro-path }}
        key: ${{ steps.paths.outputs.metro-key }}
        restore-keys: ${{ steps.paths.outputs.metro-restore }}
    # Only atomic completed archives: no leases, digests or partial stages.
    - name: Restore signed native archives
      id: archives
      if: inputs.platform == 'ios' && inputs.archive-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.archives-path }}
        key: ${{ steps.paths.outputs.archives-key }}
        restore-keys: ${{ steps.paths.outputs.archives-restore }}
    - name: Record restore evidence
      id: record
      shell: bash
      env:
        SINGZ_CI_CACHE_STATE: ${{ steps.paths.outputs.state }}
        SINGZ_MATCH_COMPILER: ${{ steps.compiler.outputs.cache-matched-key }}
        SINGZ_MATCH_GRADLE: ${{ steps.gradle.outputs.cache-matched-key }}
        SINGZ_MATCH_AUDIO: ${{ steps.audio.outputs.cache-matched-key }}
        SINGZ_MATCH_PODS: ${{ steps.pods.outputs.cache-matched-key }}
        SINGZ_MATCH_METRO: ${{ steps.metro.outputs.cache-matched-key }}
        SINGZ_MATCH_ARCHIVES: ${{ steps.archives.outputs.cache-matched-key }}
      run: node scripts/ci-build-cache.cjs record-restores
