name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Inject Google Drive OAuth client
        if: env.GDRIVE_CONFIG != ''
        shell: bash
        env:
          GDRIVE_CONFIG: ${{ secrets.GDRIVE_CONFIG }}
        run: |
          mkdir -p mobile
          printf '%s' "$GDRIVE_CONFIG" > mobile/gdrive.config.json

      - run: npm run build

      - name: Cache built engines (outputs)
        id: engines-out
        uses: actions/cache@v4
        with:
          path: |
            vendor/darwin-arm64
            vendor/darwin-x64
            vendor/win32-x64
            vendor/packs
          key: engines-out-${{ runner.os }}-${{ hashFiles('scripts/vendor-whisper.sh', 'scripts/build-gpu-pack.sh', 'scripts/build-onnx-pack.sh') }}

      - name: Cache engine sources and build trees
        if: steps.engines-out.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .engines-src
          key: engines-src-${{ runner.os }}-v4
          restore-keys: engines-src-${{ runner.os }}-

      - name: Build engines and splitter packs (macOS)
        if: runner.os == 'macOS'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/vendor-whisper.sh darwin-arm64
          bash scripts/vendor-whisper.sh darwin-x64
          bash scripts/build-gpu-pack.sh
          bash scripts/build-onnx-pack.sh darwin-x64

      - name: Build engines and splitter pack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/vendor-whisper.sh win32-x64
          bash scripts/build-onnx-pack.sh win32-x64

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singz-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            vendor/packs/*.tar.gz
          if-no-files-found: error

      # gh handles the create/update race between matrix jobs gracefully
      # (softprops/action-gh-release once lost the macOS assets to it).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # docs/release-notes/<tag>.md (committed before tagging; first line
          # is the release title) makes the release public with real notes
          # from the first attach — no file falls back to the bare create
          NOTES="docs/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            tail -n +2 "$NOTES" > /tmp/relnotes-body.md
            gh release create "$TAG" --title "$(head -n 1 "$NOTES")" --notes-file /tmp/relnotes-body.md 2>/dev/null || true
          else
            gh release create "$TAG" --title "$TAG" --notes "" 2>/dev/null || true
          fi
          # nullglob: each matrix job only has its own platform's files
          shopt -s nullglob
          FILES=(dist/*.dmg dist/*.exe dist/latest*.yml dist/*.blockmap vendor/packs/*.tar.gz)
          gh release upload "$TAG" "${FILES[@]}" --clobber
