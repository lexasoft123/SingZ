name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Cache engine sources and model weights
        uses: actions/cache@v4
        with:
          path: |
            .engines-src
            vendor/models
          key: engines-${{ runner.os }}-v2

      - name: Build bundled engines (macOS)
        if: runner.os == 'macOS'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/vendor-whisper.sh darwin-arm64
          bash scripts/vendor-whisper.sh darwin-x64
          bash scripts/vendor-demucs.sh darwin-arm64
          bash scripts/vendor-demucs.sh darwin-x64

      - name: Build GPU splitter pack (Apple Silicon)
        if: runner.os == 'macOS'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/build-gpu-pack.sh

      - name: Build bundled engines (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/vendor-whisper.sh win32-x64
          bash scripts/vendor-demucs.sh win32-x64

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singz-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            vendor/packs/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            vendor/packs/*.tar.gz
