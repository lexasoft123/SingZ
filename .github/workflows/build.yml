name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Cache built engines (outputs)
        id: engines-out
        uses: actions/cache@v4
        with:
          path: |
            vendor/darwin-arm64
            vendor/darwin-x64
            vendor/win32-x64
            vendor/models
            vendor/packs
          key: engines-out-${{ runner.os }}-${{ hashFiles('scripts/vendor-whisper.sh', 'scripts/vendor-demucs.sh', 'scripts/build-gpu-pack.sh') }}

      - name: Cache engine sources and build trees
        if: steps.engines-out.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .engines-src
          key: engines-src-${{ runner.os }}-v3
          restore-keys: engines-src-${{ runner.os }}-

      - name: Cache MSYS2 packages (Windows)
        if: runner.os == 'Windows' && steps.engines-out.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pkg-${{ runner.os }}-v1

      - name: Build bundled engines (macOS)
        if: runner.os == 'macOS'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/vendor-whisper.sh darwin-arm64
          bash scripts/vendor-whisper.sh darwin-x64
          bash scripts/vendor-demucs.sh darwin-arm64
          bash scripts/vendor-demucs.sh darwin-x64

      - name: Build GPU splitter pack (Apple Silicon)
        if: runner.os == 'macOS'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/build-gpu-pack.sh

      - name: Install MinGW OpenBLAS (Windows)
        if: runner.os == 'Windows' && steps.engines-out.outputs.cache-hit != 'true'
        shell: pwsh
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-openblas mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - name: Build bundled engines (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/vendor-whisper.sh win32-x64
          PATH="/c/msys64/mingw64/bin:$PATH" bash scripts/vendor-demucs.sh win32-x64

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singz-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            vendor/packs/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            vendor/packs/*.tar.gz
