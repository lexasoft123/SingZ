name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
    tags: ['v*']

permissions:
  contents: write

# Superseded runs of the same ref are cancelled (tags each get their own ref,
# so release builds are never cancelled).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every mobile push: the cheap canary only. npm ci runs postinstall, which
  # applies the audio-api C++ patches (fails loud on upstream drift),
  # synthesizes the bundled sample song, and bakes the Drive config —
  # everything that can rot does so here, in ~3 min, without an NDK build.
  canary:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # make-sample.js (postinstall) encodes the synthesized sample via ffmpeg
      - name: ffmpeg for the sample-song generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci
        working-directory: mobile

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: mobile

  # Full APK: only on v* release tags and manual dispatch.
  apk:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Real builds carry the Google OAuth client (drive.file scope) — the
      # repo never does. Absent secret -> Drive simply hides in the app.
      - name: Inject Google Drive OAuth client
        if: env.GDRIVE_CONFIG != ''
        env:
          GDRIVE_CONFIG: ${{ secrets.GDRIVE_CONFIG }}
        run: printf '%s' "$GDRIVE_CONFIG" > mobile/gdrive.config.json

      # make-sample.js (postinstall) encodes the synthesized sample via ffmpeg
      - name: ffmpeg for the sample-song generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # postinstall applies the audio-api C++ patches and fails loud on
      # upstream drift. It also synthesizes the bundled sample project (an
      # original composition; the repo carries no audio).
      - run: npm ci
        working-directory: mobile

      - name: Pinned NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: SingZ-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --notes "" 2>/dev/null || true
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "SingZ-$TAG-android.apk"
          gh release upload "$TAG" "SingZ-$TAG-android.apk" --clobber
