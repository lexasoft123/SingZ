name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # postinstall applies the audio-api C++ patches and fails loud on
      # upstream drift — this is the patch-drift canary as much as a build
      - run: npm ci
        working-directory: mobile

      # sample stems are gitignored (real audio); Metro's release bundling
      # only needs the require()d files to exist, so feed it silence
      - name: Placeholder sample stems
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p mobile/assets/sample/stems
          for s in vocals drums bass guitar piano other; do
            ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 1 \
              -sample_fmt s16 -c:a flac "mobile/assets/sample/stems/$s.flac" </dev/null
          done

      - name: Pinned NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: SingZ-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --notes "" 2>/dev/null || true
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "SingZ-$TAG-android.apk"
          gh release upload "$TAG" "SingZ-$TAG-android.apk" --clobber
