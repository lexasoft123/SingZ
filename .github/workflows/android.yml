name: Android

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track — "validate" checks credentials and ships nothing'
        type: choice
        default: validate
        options: [validate, internal, closed, production]
      metadata:
        description: 'Also push the store listing text and graphics'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'zcore/**'
      - 'zdsp/**'
      - 'third_party/native/**'
      - 'third_party/zcore/**'
      - 'third_party/zcore.lock.json'
      - 'tools/native/**'
      - '.github/workflows/android.yml'
      - '.github/actions/mobile-build-cache/**'
      - '.github/actions/save-mobile-build-cache/**'
      - 'scripts/ci-build-cache.cjs'
      - 'scripts/ci-android-cache-smoke.cjs'
      - 'tests/tooling/ci-android-cache.test.cjs'
      - 'scripts/ccache-launcher.*'
      - 'scripts/restore-audio-api-prebuilts.cjs'
      - 'scripts/native-build-lock.cjs'
      - 'scripts/assert-native-build-lock.cjs'
      - 'scripts/with-native-build-lock.mjs'
      # editing the release notes should check the store text they generate
      - 'docs/release-notes/**'
      - 'scripts/store-notes.cjs'
      # the canary compiles these — an edit must run its own gate
      - 'tests/native/**'
      - 'tests/shared/**'
      - 'scripts/run-core-host-tests.sh'
      # …and it now runs the Beat This! parity gate, which reads these. The
      # expectation is a RECORDING of the python runner's answer, so a bad
      # regeneration is exactly the edit that must not reach main unrun —
      # and without these it would sit green until someone else's unrelated
      # mobile/** push happened to surface it.
      - 'eval/mlgrid-parity.mjs'
      - 'eval/beats/ml-fixtures.mjs'
      - 'eval/beats/ml-postproc-expected.json'
      - 'scripts/build-analyze-host.sh'
    tags: ['v*']
  pull_request:
    paths:
      - 'mobile/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'zcore/**'
      - 'zdsp/**'
      - 'third_party/native/**'
      - 'third_party/zcore/**'
      - 'third_party/zcore.lock.json'
      - 'tools/native/**'
      - '.github/workflows/android.yml'
      - '.github/actions/mobile-build-cache/**'
      - '.github/actions/save-mobile-build-cache/**'
      - 'scripts/ci-build-cache.cjs'
      - 'scripts/ci-android-cache-smoke.cjs'
      - 'tests/tooling/ci-android-cache.test.cjs'
      - 'scripts/ccache-launcher.*'
      - 'scripts/restore-audio-api-prebuilts.cjs'
      - 'scripts/native-build-lock.cjs'
      - 'scripts/assert-native-build-lock.cjs'
      - 'scripts/with-native-build-lock.mjs'
      - 'docs/release-notes/**'
      - 'scripts/store-notes.cjs'
      - 'tests/native/**'
      - 'tests/shared/**'
      - 'scripts/run-core-host-tests.sh'
      - 'eval/mlgrid-parity.mjs'
      - 'eval/beats/ml-fixtures.mjs'
      - 'eval/beats/ml-postproc-expected.json'
      - 'scripts/build-analyze-host.sh'
  # Keeps main's ccache warm. Actions caches cannot be shared between tags —
  # a run reads only its own ref and the DEFAULT BRANCH — so a tag build can
  # never inherit from a sibling tag, and the artifacts job otherwise runs on
  # tags only. Without this, the only cache a release could inherit was
  # whatever a one-off dispatch happened to leave on main; v0.16.0 restored
  # one written five hours before the shared C++ core landed.
  #
  # DAILY, not weekly. A weekly warmer was the first attempt and it is not
  # enough: mobile/ moves most days, and a tag is cut whenever it is ready,
  # so the cache has to be at most a day behind. It costs little once warm —
  # the daily run inherits its own previous cache, so only what changed that
  # day recompiles.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

# Superseded runs of the same ref are cancelled (tags each get their own ref,
# so release builds are never cancelled).
#
# The event is part of the group because the daily warmer runs on main and so
# carries the same github.ref a mobile/** push does. Grouped on ref alone,
# a push landing inside the warmer's half-hour would cancel it — and
# actions/cache does not save on a cancelled job, so that day's warm would be
# lost silently — or the warmer would cancel a canary, which reads on main as
# a broken build. Weekly made that a rare coincidence; daily would make it a
# daily one.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every mobile push/PR: JS/JVM checks plus the dormant AudioHost two-ABI NDK
  # compile/package proof. npm ci runs postinstall, which
  # applies the audio-api C++ patches (fails loud on upstream drift),
  # synthesizes the bundled sample song, and bakes the Drive config —
  # everything that can rot does so here before product audio can be touched.
  canary:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # A warning, not a failure: the version is often bumped before the notes
      # are written, and blocking every intermediate push on prose nobody has
      # composed yet would just teach people to ignore a red canary. The
      # publish job refuses outright, which is the gate that matters.
      - name: Store notes match the release notes
        run: |
          node scripts/store-notes.cjs --check ||
            echo "::warning::Store notes are not ready — the publish job will refuse this."

      # ffmpeg generates the sample; the host C++ tests build the Linux audio backend.
      - name: Sample generator and native host dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libasound2-dev libudev-dev pkg-config

      - name: Android CI cache contracts
        run: node --test tests/tooling/ci-android-cache.test.cjs

      - name: Shared Android build caches
        id: mobile-cache
        uses: ./.github/actions/mobile-build-cache
        with:
          platform: android

      - run: npm ci
        working-directory: mobile

      # `npm ci` installs react-native-audio-api from its npm tarball, which
      # does NOT carry the prebuilt FFmpeg compatibility libraries — and
      # gradle's preBuild gate (`verifyFfmpegCodecRuntime`, added with Phase
      # 4B) checks those pinned artifacts by checksum before it will build
      # anything. Without this the canary dies on "Missing pinned FFmpeg
      # artifact" three minutes in, having compiled nothing. The packaging
      # path restores them through the same checksum-verified download cache;
      # extracted libraries remain local to this dependency installation.
      - name: Restore react-native-audio-api prebuilt binaries
        run: node scripts/restore-audio-api-prebuilts.cjs android

      - name: Build cache and generated-input regressions
        run: node --test mobile/scripts/tests/*.test.cjs

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: mobile

      # The phone's Drive logic no device can show: the protocol, the offline
      # fallbacks, and the ✓ agreeing with the download rule.
      - name: Jest
        run: npx jest
        working-directory: mobile

      # "Is this copy current?" is one table read by three runners. The Kotlin
      # one needs a JDK but no emulator; the Swift one is macOS-only and runs
      # in the E2E workflow.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pinned NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Begin Android cache evidence
        id: cache-begin
        run: node scripts/ci-build-cache.cjs begin --platform android

      - name: Prove Gradle task and configuration caches
        run: node scripts/ci-android-cache-smoke.cjs

      - name: Cache-currency conformance (Kotlin)
        run: |
          set -euo pipefail
          node ../../scripts/with-native-build-lock.mjs --owner ci-android-jvm -- \
            ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 \
            --build-cache --configuration-cache --configuration-cache-problems=fail --console=plain \
            2>&1 | tee "$RUNNER_TEMP/singz-android-jvm-gradle.log"
        working-directory: mobile/android

      # Compile the dormant paired-stream provider for both shipping phone
      # ABIs on every PR. The probe keeps the provider object in the shared
      # library without opening product audio, and proves that this is more
      # than a host-only policy-test build.
      - name: Android AudioHost NDK conformance
        id: android-native
        run: |
          set -euo pipefail
          node ../../scripts/with-native-build-lock.mjs --owner ci-android-native -- \
            ./gradlew :app:externalNativeBuildDebug :app:assembleDebug --no-daemon --max-workers=1 \
            --build-cache --configuration-cache --configuration-cache-problems=fail --console=plain \
            2>&1 | tee "$RUNNER_TEMP/singz-android-native-gradle.log"
        working-directory: mobile/android

      - name: Verify Android native cache activity
        if: always() && steps.cache-begin.outcome == 'success'
        run: |
          set -euo pipefail
          requirements=()
          if [ "${{ steps.android-native.outcome }}" = success ]; then requirements+=(--require-native); fi
          node scripts/ci-build-cache.cjs report --platform android "${requirements[@]}" \
            --log "$RUNNER_TEMP/singz-android-native-gradle.log" \
            --log "$RUNNER_TEMP/singz-android-jvm-gradle.log"

      # Negative RT fixtures are intentionally not part of every product
      # build. Run the explicit target for each shipping ABI here; it fails
      # closed unless the configured NDK Clang compiles every bypass fixture.
      - name: Android AudioHost RT negative policy
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mapfile -t build_files < <(find mobile/android/app/.cxx/Debug -path "*/$abi/build.ninja" -type f -print)
            test "${#build_files[@]}" -gt 0
            for build_file in "${build_files[@]}"; do
              node scripts/with-native-build-lock.mjs --owner ci-android-rt-negative -- \
                cmake --build "$(dirname "$build_file")" --target singz_check_android_audio_host_realtime_negative --parallel 4
            done
          done

      - name: Android AudioHost provider symbols and callback flags
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            lib="mobile/android/app/build/intermediates/cmake/debug/obj/$abi/libsingzcore.so"
            test -f "$lib"
            nm_file="$RUNNER_TEMP/singzcore-$abi.nm"
            strings_file="$RUNNER_TEMP/singzcore-$abi.strings"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$lib" > "$nm_file"
            strings "$lib" > "$strings_file"
            grep -F 'Java_com_singzplayer_split_SingzCore_hasAndroidAudioHostProvider' "$nm_file"
            grep -F 'singz.android.oboe.audio_host.phase3d' "$strings_file"

            valid_compile_dbs=()
            while IFS= read -r compile_db; do
              if jq -e '
                [
                  .[] |
                  select(.file | test("/zcore/platform/android/audio_host_android_callback(_policy)?\\.cpp$")) |
                  {file, command}
                ] as $entries |
                ($entries | length) == 2 and
                ([$entries[].file | select(endswith("/audio_host_android_callback.cpp"))] | length) == 1 and
                ([$entries[].file | select(endswith("/audio_host_android_callback_policy.cpp"))] | length) == 1 and
                all($entries[];
                  (.command | contains("-DSINGZ_ANDROID_AUDIO_HOST_RT_COMPILE=1")) and
                  (.command | contains("-fno-exceptions")) and
                  (.command | contains("-fno-rtti"))
                )
              ' "$compile_db" > /dev/null; then
                valid_compile_dbs+=("$compile_db")
              fi
            done < <(find mobile/android/app/.cxx/Debug -path "*/$abi/compile_commands.json" -type f -print)
            test "${#valid_compile_dbs[@]}" -eq 1

            compile_dir="$(dirname "${valid_compile_dbs[0]}")"
            callback_objects=(
              "$compile_dir/singz-native/third_party/zcore/CMakeFiles/zcore_device.dir/zcore/platform/android/audio_host_android_callback.cpp.o"
              "$compile_dir/singz-native/third_party/zcore/CMakeFiles/zcore_device.dir/zcore/platform/android/audio_host_android_callback_policy.cpp.o"
            )
            test "${#callback_objects[@]}" -eq 2
            for object in "${callback_objects[@]}"; do
              test -s "$object"
            done
          done

          apk_list="$RUNNER_TEMP/singz-debug-apk.list"
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk > "$apk_list"
          grep -F 'lib/arm64-v8a/libsingzcore.so' "$apk_list"
          grep -F 'lib/armeabi-v7a/libsingzcore.so' "$apk_list"

      # The C++ core's ORT-free pieces, compiled for the host — no NDK, no
      # device: the resampler's quality claim (>90 dB SNR, measured) and the
      # WAV writer's byte contract (the desktop renderer's exact scale and
      # clamp). The ORT-adjacent halves (overlap-add, resume tail) are
      # proven on-device by mobile/tests/split-android.cjs instead.
      - name: Native core host tests
        run: scripts/run-core-host-tests.sh

      - name: Upload Android cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cache-evidence-${{ github.job }}
          path: ${{ runner.temp }}/singz-cache-report
          retention-days: 7

      - name: Save shared mobile caches
        if: always() && steps.mobile-cache.outputs.state != ''
        uses: ./.github/actions/save-mobile-build-cache
        with:
          cache-state: ${{ steps.mobile-cache.outputs.state }}

  # Shippable artifacts: only on v* release tags and manual dispatch.
  # The AAB is what Google Play takes; the APK is what the family sideloads.
  # One gradle invocation builds both so the NDK objects are compiled once.
  artifacts:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Real builds carry the Google OAuth client (drive.file scope) — the
      # repo never does. Absent secret -> Drive simply hides in the app, which
      # is fine for a dispatch build and unshippable for a release: the store
      # listing promises sync. The test is in the shell, not a step `if`, so
      # the log says which way it went.
      - name: Inject Google Drive OAuth client
        env:
          GDRIVE_CONFIG: ${{ secrets.GDRIVE_CONFIG }}
        run: |
          if [ -n "$GDRIVE_CONFIG" ]; then
            printf '%s' "$GDRIVE_CONFIG" > mobile/gdrive.config.json
            echo "Drive OAuth client injected."
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "::error::GDRIVE_CONFIG is not set — a release tag would ship with"\
                 "Google Drive sync silently missing."
            exit 1
          else
            echo "::warning::No GDRIVE_CONFIG — Drive sync is hidden in this build."
          fi

      # make-sample.js (postinstall) encodes the synthesized sample via
      # ffmpeg; the common action restores compiler objects and downloads,
      # while Gradle also caches eligible task outputs.
      - name: ffmpeg for the sample-song generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Android CI cache contracts
        run: node --test tests/tooling/ci-android-cache.test.cjs

      - name: Shared Android build caches
        id: mobile-cache
        uses: ./.github/actions/mobile-build-cache
        with:
          platform: android

      - run: npm ci
        working-directory: mobile

      # `npm ci` installs react-native-audio-api from its npm tarball, which
      # does NOT carry the prebuilt FFmpeg compatibility libraries — and
      # gradle's preBuild gate (`verifyFfmpegCodecRuntime`, added with Phase
      # 4B) checks those pinned artifacts by checksum before it will build
      # anything. Without this the canary dies on "Missing pinned FFmpeg
      # artifact" three minutes in, having compiled nothing. The packaging
      # path restores them through the same checksum-verified download cache;
      # extracted libraries remain local to this dependency installation.
      - name: Restore react-native-audio-api prebuilt binaries
        run: node scripts/restore-audio-api-prebuilts.cjs android

      # Neither version ships in the runner image — ubuntu-latest was 24.04
      # with NDK 27.3/28.2/29.0 and CMake 3.31/4.1 when this was written — so
      # sdkmanager downloads and EXTRACTS a fresh toolchain on every run. That
      # is what CCACHE_COMPILERCHECK below is about; see the build step. The
      # fix does not depend on which image is current, only on the pin being
      # something the image does not already have.
      - name: Pinned NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Begin Android cache evidence
        id: cache-begin
        run: node scripts/ci-build-cache.cjs begin --platform android

      - name: Prove Gradle task and configuration caches
        run: node scripts/ci-android-cache-smoke.cjs

      # The Play upload key. Without it gradle falls back to the debug key,
      # which Play rejects on upload with a message that never names the key —
      # so a tag build fails here instead, where the cause is legible.
      - name: Restore Play upload key
        id: upload-key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a release tag cannot"\
                   "produce a Play-shippable bundle. See docs/ANDROID-RELEASE.md."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key; this dispatch build is debug-signed and not shippable."
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle + APK
        id: android-release
        env:
          # Compiler identity, PCH policy and capacity come from the common
          # launchers and shared cache action, just as they do for local builds.
          SINGZ_KEYSTORE_FILE: ${{ steps.upload-key.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          SINGZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SINGZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SINGZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node ../../scripts/with-native-build-lock.mjs --owner ci-android-release -- \
            ./gradlew bundleRelease assembleRelease --no-daemon --max-workers=1 \
            --build-cache --configuration-cache --configuration-cache-problems=fail --console=plain \
            2>&1 | tee "$RUNNER_TEMP/singz-android-release-gradle.log"
        working-directory: mobile/android

      - name: Verify Android native cache activity
        if: always() && steps.cache-begin.outcome == 'success'
        run: |
          set -euo pipefail
          requirements=()
          if [ "${{ steps.android-release.outcome }}" = success ]; then requirements+=(--require-native); fi
          node scripts/ci-build-cache.cjs report --platform android "${requirements[@]}" \
            --log "$RUNNER_TEMP/singz-android-release-gradle.log"

      - name: Verify release DEX optimization
        run: python3 scripts/check-android-optimization.py mobile/android/app/build/outputs/bundle/release/app-release.aab

      # Proof, in the log, of the two things Play refuses a bundle for:
      # a key it does not expect, and a versionCode it has already seen.
      - name: Report bundle identity
        run: |
          BUNDLE=mobile/android/app/build/outputs/bundle/release/app-release.aab
          unzip -p "$BUNDLE" BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties || true
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump badging \
            mobile/android/app/build/outputs/apk/release/app-release.apk \
            | grep -E "^package:" || true
          keytool -printcert -jarfile "$BUNDLE" | grep -E "Owner:|SHA1:" || true

      # Not on the daily warmer: nobody downloads those, and keeping a signed
      # bundle + APK for 30 days each would park ~8 GB of artifact storage to
      # no purpose. The build itself still ran, which is the point — and the
      # `Report bundle identity` step above means the daily run also proves
      # the keystore secret still decodes.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: SingZ-android
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/mapping/release/
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # same notes-at-create logic as build.yml — whichever workflow wins
          # the race publishes the release already titled and noted
          NOTES="docs/release-notes/$TAG.md"
          # same prerelease rule as build.yml: hyphenated tags never go "latest"
          PRE=(); case "$TAG" in *-*) PRE=(--prerelease);; esac
          if [ -f "$NOTES" ]; then
            # The shared store blocks stay: they have opened every release page
            # since v0.14.6 and read as the short version, in both languages.
            # The `:ios` overrides are store-only text — publishing them here
            # would summarise the same release twice per language. The markers
            # are HTML comments, so they hide themselves and never the text
            # between them.
            # Both addresses are anchored to whole lines and single-spaced —
            # canonical marker form, which store-notes.cjs REJECTS anything but,
            # so the two parsers cannot drift apart. That check is what makes
            # this safe; the anchors alone are not. Unanchored, a hand-written
            # one-line `:ios` block would be invisible to the generator (which
            # wants a newline after the opener) while this range ran on to the
            # NEXT `/store` and silently ate a shared block.
            tail -n +2 "$NOTES" | sed '/^<!-- store:[^ ]*:ios -->$/,/^<!-- \/store -->$/d' > /tmp/relnotes-body.md
            gh release create "$TAG" "${PRE[@]}" --title "$(head -n 1 "$NOTES")" --notes-file /tmp/relnotes-body.md 2>/dev/null || true
          else
            gh release create "$TAG" "${PRE[@]}" --title "$TAG" --notes "" 2>/dev/null || true
          fi
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "SingZ-$TAG-android.apk"
          # The .aab is what gets uploaded to the Play Console by hand; the
          # .apk stays the sideload for the family fleet.
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "SingZ-$TAG-android.aab"
          gh release upload "$TAG" "SingZ-$TAG-android.apk" "SingZ-$TAG-android.aab" --clobber

      - name: Upload Android cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cache-evidence-${{ github.job }}
          path: ${{ runner.temp }}/singz-cache-report
          retention-days: 7

      - name: Save shared mobile caches
        if: always() && steps.mobile-cache.outputs.state != ''
        uses: ./.github/actions/save-mobile-build-cache
        with:
          cache-state: ${{ steps.mobile-cache.outputs.state }}

  # Play upload.
  #
  # A v* tag ships to the CLOSED testing track automatically — that is the
  # point of tagging, and testers should not wait on someone remembering to
  # press a button. Production is never automatic: it reaches strangers, a
  # staged rollout is a judgement call, and "git tag" is too easy to type.
  # Reaching production means dispatching this workflow and choosing it.
  #
  # The very first bundle for a package cannot come through here — the Play
  # Developer API cannot create an app entry and refuses a package it has never
  # seen. That upload is done by hand, once. See docs/ANDROID-RELEASE.md.
  # Hyphenated tags are prereleases (docs/PROJECT-RULES.md § Releasing) and must never
  # reach Play. Until now the only thing stopping them was that a -micN notes
  # file carries no store text, so sync_changelog died on a missing file —
  # an accident, not a refusal: writing those blocks would have uploaded a
  # prerelease to real testers. The convention is enforced here instead, the
  # same way the artifacts job already decides --prerelease.
  publish:
    if: >-
      (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-'))
      || github.event_name == 'workflow_dispatch'
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile/android

      - uses: actions/download-artifact@v4
        with:
          name: SingZ-android
          path: artifact

      # upload-artifact keeps the common ancestor of the paths it was given, so
      # the bundle arrives nested. Find it rather than hardcoding that shape.
      - name: Put the bundle where fastlane looks for it
        run: |
          AAB=$(find artifact -name '*.aab' | head -1)
          [ -n "$AAB" ] || { echo "::error::no .aab in the build artifact"; exit 1; }
          mkdir -p mobile/android/app/build/outputs/bundle/release
          cp "$AAB" mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Play
        working-directory: mobile/android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Deliberately no default here — the Fastfile owns it. This line used
          # to end in `|| 'alpha'`, which is a stock track nobody ever opened in
          # the console, so v0.15.0 uploaded its whole bundle and was then told
          # "Release in track targeting no countries". Two defaults for one
          # setting is one too many; set the repo variable to override.
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
          # fastlane refuses to run under a non-UTF-8 locale
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — see docs/ANDROID-RELEASE.md"
            exit 1
          fi
          # A tag always means the closed track. Only a hand-driven run gets to
          # pick, which is the whole reason production is not on this path.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            LANE=closed
          else
            LANE="${{ inputs.track }}"
          fi
          echo "publishing with lane: $LANE"
          bundle exec fastlane android "$LANE"
          if [ "${{ inputs.metadata }}" = "true" ]; then
            bundle exec fastlane android metadata
          fi
