name: Android

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track — "validate" checks credentials and ships nothing'
        type: choice
        default: validate
        options: [validate, internal, closed, production]
      metadata:
        description: 'Also push the store listing text and graphics'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
      # editing the release notes should check the store text they generate
      - 'docs/release-notes/**'
      - 'scripts/store-notes.cjs'
      # the canary compiles these — an edit must run its own gate
      - 'tests/native/**'
      - 'scripts/run-core-host-tests.sh'
      # …and it now runs the Beat This! parity gate, which reads these. The
      # expectation is a RECORDING of the python runner's answer, so a bad
      # regeneration is exactly the edit that must not reach main unrun —
      # and without these it would sit green until someone else's unrelated
      # mobile/** push happened to surface it.
      - 'eval/mlgrid-parity.mjs'
      - 'eval/beats/ml-fixtures.mjs'
      - 'eval/beats/ml-postproc-expected.json'
      - 'scripts/build-analyze-host.sh'
    tags: ['v*']
  # Keeps main's ccache warm. Actions caches cannot be shared between tags —
  # a run reads only its own ref and the DEFAULT BRANCH — so a tag build can
  # never inherit from a sibling tag, and the artifacts job otherwise runs on
  # tags only. Without this, the only cache a release could inherit was
  # whatever a one-off dispatch happened to leave on main; v0.16.0 restored
  # one written five hours before the shared C++ core landed.
  #
  # DAILY, not weekly. A weekly warmer was the first attempt and it is not
  # enough: mobile/ moves most days, and a tag is cut whenever it is ready,
  # so the cache has to be at most a day behind. It costs little once warm —
  # the daily run inherits its own previous cache, so only what changed that
  # day recompiles.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

# Superseded runs of the same ref are cancelled (tags each get their own ref,
# so release builds are never cancelled).
#
# The event is part of the group because the daily warmer runs on main and so
# carries the same github.ref a mobile/** push does. Grouped on ref alone,
# a push landing inside the warmer's half-hour would cancel it — and
# actions/cache does not save on a cancelled job, so that day's warm would be
# lost silently — or the warmer would cancel a canary, which reads on main as
# a broken build. Weekly made that a rare coincidence; daily would make it a
# daily one.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every mobile push: the cheap canary only. npm ci runs postinstall, which
  # applies the audio-api C++ patches (fails loud on upstream drift),
  # synthesizes the bundled sample song, and bakes the Drive config —
  # everything that can rot does so here, in ~3 min, without an NDK build.
  canary:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # A warning, not a failure: the version is often bumped before the notes
      # are written, and blocking every intermediate push on prose nobody has
      # composed yet would just teach people to ignore a red canary. The
      # publish job refuses outright, which is the gate that matters.
      - name: Store notes match the release notes
        run: |
          node scripts/store-notes.cjs --check ||
            echo "::warning::Store notes are not ready — the publish job will refuse this."

      # make-sample.js (postinstall) encodes the synthesized sample via ffmpeg
      - name: ffmpeg for the sample-song generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci
        working-directory: mobile

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: mobile

      # The phone's Drive logic no device can show: the protocol, the offline
      # fallbacks, and the ✓ agreeing with the download rule.
      - name: Jest
        run: npx jest
        working-directory: mobile

      # "Is this copy current?" is one table read by three runners. The Kotlin
      # one needs a JDK but no emulator; the Swift one is macOS-only and runs
      # in the E2E workflow.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache-currency conformance (Kotlin)
        run: ./gradlew :app:testDebugUnitTest
        working-directory: mobile/android

      # The C++ core's ORT-free pieces, compiled for the host — no NDK, no
      # device: the resampler's quality claim (>90 dB SNR, measured) and the
      # WAV writer's byte contract (the desktop renderer's exact scale and
      # clamp). The ORT-adjacent halves (overlap-add, resume tail) are
      # proven on-device by mobile/tests/split-android.cjs instead.
      - name: Native core host tests
        run: scripts/run-core-host-tests.sh

  # Shippable artifacts: only on v* release tags and manual dispatch.
  # The AAB is what Google Play takes; the APK is what the family sideloads.
  # One gradle invocation builds both so the NDK objects are compiled once.
  artifacts:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Real builds carry the Google OAuth client (drive.file scope) — the
      # repo never does. Absent secret -> Drive simply hides in the app, which
      # is fine for a dispatch build and unshippable for a release: the store
      # listing promises sync. The test is in the shell, not a step `if`, so
      # the log says which way it went.
      - name: Inject Google Drive OAuth client
        env:
          GDRIVE_CONFIG: ${{ secrets.GDRIVE_CONFIG }}
        run: |
          if [ -n "$GDRIVE_CONFIG" ]; then
            printf '%s' "$GDRIVE_CONFIG" > mobile/gdrive.config.json
            echo "Drive OAuth client injected."
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "::error::GDRIVE_CONFIG is not set — a release tag would ship with"\
                 "Google Drive sync silently missing."
            exit 1
          else
            echo "::warning::No GDRIVE_CONFIG — Drive sync is hidden in this build."
          fi

      # make-sample.js (postinstall) encodes the synthesized sample via
      # ffmpeg; ccache makes the NDK compile of the audio engine incremental
      # across tag builds (the gradle cache only covers dependencies).
      - name: ffmpeg + ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ccache

      # The key carries the run id because actions/cache is WRITE-ONCE per key:
      # with a stable key the first save is frozen forever and later runs
      # restore it but never save an improved one. That is not a theory — the
      # first CI build of this job reported "Hits: 0 / 712 (0.00%)". A unique
      # key per run plus a prefix restore means every run inherits the best
      # previous cache and then saves a superset.
      - name: ccache store
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-apk-${{ hashFiles('mobile/package-lock.json', 'mobile/scripts/patch-audio-api.js') }}-${{ github.run_id }}
          # audio-api version or our C++ patches changing invalidates most
          # objects anyway; the bare prefix keeps partial hits across bumps
          restore-keys: |
            ccache-apk-${{ hashFiles('mobile/package-lock.json', 'mobile/scripts/patch-audio-api.js') }}-
            ccache-apk-

      # postinstall applies the audio-api C++ patches and fails loud on
      # upstream drift. It also synthesizes the bundled sample project (an
      # original composition; the repo carries no audio).
      - run: npm ci
        working-directory: mobile

      # Neither version ships in the runner image — ubuntu-latest was 24.04
      # with NDK 27.3/28.2/29.0 and CMake 3.31/4.1 when this was written — so
      # sdkmanager downloads and EXTRACTS a fresh toolchain on every run. That
      # is what CCACHE_COMPILERCHECK below is about; see the build step. The
      # fix does not depend on which image is current, only on the pin being
      # something the image does not already have.
      - name: Pinned NDK + CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      # The Play upload key. Without it gradle falls back to the debug key,
      # which Play rejects on upload with a message that never names the key —
      # so a tag build fails here instead, where the cause is legible.
      - name: Restore Play upload key
        id: upload-key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a release tag cannot"\
                   "produce a Play-shippable bundle. See docs/ANDROID-RELEASE.md."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key; this dispatch build is debug-signed and not shippable."
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle + APK
        env:
          # CMake picks these up from the environment (>=3.17), so every
          # native module gets ccache without touching its build files
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.ccache
          # Why the cacheable half of this build never hit once. ccache's
          # default compiler_check is `mtime`, which hashes the compiler's
          # mtime and size — and the pinned NDK is re-extracted every run, so
          # clang's mtime is new every time and every object misses no matter
          # how good the cache is. v0.16.0 and v0.16.1 both restored 146 MB
          # and both reported "Hits: 0 / 732 (0.00%)"; so did every android
          # run before them. Hashing the binary's content instead is, per
          # ccache's own manual, "very slightly slower".
          #
          # The value is itself part of ccache's hash, so changing it orphans
          # every entry keyed under the old one: the first run after such a
          # change reports 0% however healthy the cache is, and the one after
          # it is the first that can hit. Measured on two back-to-back
          # dispatches on main: 0/366, then 366/366 direct hits and a 13m24s
          # build became 5m54s.
          CCACHE_COMPILERCHECK: content
          # The rest of the build. `ccache -sv` reported 296 uncacheable calls
          # of which 288 (97.3%) were "Could not use precompiled header" and
          # only 8 were actual link steps — so PCH, not linking, was the whole
          # 45% that compiler_check could not reach. reanimated and worklets
          # are the only two modules in the tree, ours included, that call
          # target_precompile_headers, and they account for the number
          # exactly: 106 compile_commands entries + 38, times two ABIs, is
          # 288. Both the generator and the consumers are counted uncacheable
          # without this, which is why the arithmetic lands on the nose.
          #
          # ccache needs three things to cache a clang PCH compile. Two are
          # already present: -include-pch from CMake's PCH support, and
          # -fno-pch-timestamp — which comes NOT from CMake but from those two
          # packages' own CMakeLists (target_compile_options ... -Xclang;
          # -fno-pch-timestamp, upstream comment says it is for ccache). That
          # makes it a dependency opt-in, not something structural: if a
          # reanimated or worklets bump ever drops it, these 288 go back to
          # missing every run, because clang bakes the header's mtime into the
          # .pch and npm ci gives every header a fresh mtime. This is the
          # third requirement and the only one we were missing.
          #
          # `time_macros` is inert here rather than merely tolerable: nothing
          # we compile — reanimated, worklets, audio-api, skia, our own core —
          # mentions __DATE__, __TIME__ or __TIMESTAMP__ at all, so there is
          # nothing for it to be sloppy about. `pch_defines` is the real
          # trade, and it is narrow: CMake force-includes the PCH ahead of the
          # translation unit, so a source-level #define cannot change it, and
          # command-line -D still gets hashed normally.
          #
          # The manual also suggests include_file_mtime,include_file_ctime.
          # Deliberately NOT set: we measured 366/366 without them, so there
          # is no evidence they are needed here, and they would give up real
          # header-change detection to buy nothing.
          #
          # Unlike compiler_check, this does NOT orphan the existing cache —
          # entries stored with sloppiness unset still direct-hit with it set.
          # So expect ~366 hits plus ~288 fresh misses on the first run after
          # this, and on the second a Hits line of ~654/654 (100%) against a
          # Cacheable-calls line of ~654/662 — two different ratios that -sv
          # prints one above the other. Only files using the time macros would
          # re-populate, and there are none.
          CCACHE_SLOPPINESS: pch_defines,time_macros
          SINGZ_KEYSTORE_FILE: ${{ steps.upload-key.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          SINGZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SINGZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SINGZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Bounded, but with real headroom, because overflowing this is the
          # one failure here that is SILENT: ccache LRU-evicts inside the run,
          # hits go partial, the build creeps back up and nothing in the log
          # says why — it just looks like the cache fix stopped holding.
          # Everything in this block is DECIMAL GB, because that is what both
          # tools here actually speak. ccache's bare M suffix is decimal (the
          # manual: "kB, MB, GB, TB (decimal), KiB, MiB, GiB or TiB
          # (binary)"), and 4.9.1's "Cache size (GB)" line means what it says
          # — verified rather than assumed, by changing the cap: 600M printed
          # "/ 0.6" and 1200M prints "/ 1.2". `gh api …/actions/cache/usage`
          # returns decimal bytes too.
          #
          # Measured at two ABIs with compiler_check fixed: 0.2 of 0.6, and
          # PCH caching took it to 0.4 of 1.2 — 284 more objects plus four
          # .pch blobs (two modules x two ABIs; the 288 above is those 284
          # plus the four generator compiles), a .pch carrying libc++, fbjni
          # and jsi being tens of MB on its own. 0.4 against the old 600M cap
          # is 67%, which is why it moved.
          #
          # Raising the cap does not make the cache grow — the four flat
          # ccache-apk entries measured 231.49, 231.48, 231.48 and 231.46 MB,
          # which is what a superset-save under a unique key per run should
          # look like. What ships to Actions is what ccache stores, not the
          # cap; the cap only stops eviction INSIDE the run. The other two of
          # the six are the PCH one at 396.13 MB — content, not the raised cap
          # — and a 152.99 MB fossil predating the run-id key and the ABI cut.
          #
          # But do not read that as free. The repo's Actions budget is
          # SATURATED — 10.45 GB across 22 caches against a documented 10 GB —
          # so every new entry evicts older ones to fit:
          #
          #   setup-java gradle   6.08 GB   4 entries   <- the real pressure
          #   ccache-apk          1.48 GB   6 entries   <- this, and growing
          #   engines-src-Windows 0.86 GB   1
          #   engines-src-macOS   0.63 GB   1
          #   engines-out-macOS   0.49 GB   1
          #
          # Only ccache-apk's newest entry is ever restored — a unique key per
          # run never prunes the ones it supersedes, so five of those six are
          # dead weight, and PCH content made each new one bigger. What loses
          # an LRU race is whatever is touched least, which is the engine
          # caches, so an android cache that grows costs a DESKTOP run an
          # engine rebuild, on another workflow, with nothing connecting the
          # two. Pruning superseded ccache-apk entries, or trimming
          # setup-java's generations, frees several times what any argument
          # about this cap is worth.
          #
          # Go and measure rather than trusting a word of this — and mind the
          # units when you do. An earlier draft of this block reported
          # watching 700 MB get evicted; nothing had happened at all. It had
          # divided cache/usage's decimal bytes by 2^30 and compared the
          # result against the same figure in decimal, which is a 7.4% gap
          # and looks exactly like an eviction.
          ccache -M 1200M
          ccache -z
          ./gradlew bundleRelease assembleRelease --no-daemon
          # -sv, not -s: the summary alone said 45% of calls were
          # "uncacheable" without ever saying why, which is not something to
          # go guessing about a second time.
          ccache -sv
        working-directory: mobile/android

      # Proof, in the log, of the two things Play refuses a bundle for:
      # a key it does not expect, and a versionCode it has already seen.
      - name: Report bundle identity
        run: |
          BUNDLE=mobile/android/app/build/outputs/bundle/release/app-release.aab
          unzip -p "$BUNDLE" BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties || true
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump badging \
            mobile/android/app/build/outputs/apk/release/app-release.apk \
            | grep -E "^package:" || true
          keytool -printcert -jarfile "$BUNDLE" | grep -E "Owner:|SHA1:" || true

      # Not on the daily warmer: nobody downloads those, and keeping a signed
      # bundle + APK for 30 days each would park ~8 GB of artifact storage to
      # no purpose. The build itself still ran, which is the point — and the
      # `Report bundle identity` step above means the daily run also proves
      # the keystore secret still decodes.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: SingZ-android
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # same notes-at-create logic as build.yml — whichever workflow wins
          # the race publishes the release already titled and noted
          NOTES="docs/release-notes/$TAG.md"
          # same prerelease rule as build.yml: hyphenated tags never go "latest"
          PRE=(); case "$TAG" in *-*) PRE=(--prerelease);; esac
          if [ -f "$NOTES" ]; then
            tail -n +2 "$NOTES" > /tmp/relnotes-body.md
            gh release create "$TAG" "${PRE[@]}" --title "$(head -n 1 "$NOTES")" --notes-file /tmp/relnotes-body.md 2>/dev/null || true
          else
            gh release create "$TAG" "${PRE[@]}" --title "$TAG" --notes "" 2>/dev/null || true
          fi
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "SingZ-$TAG-android.apk"
          # The .aab is what gets uploaded to the Play Console by hand; the
          # .apk stays the sideload for the family fleet.
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "SingZ-$TAG-android.aab"
          gh release upload "$TAG" "SingZ-$TAG-android.apk" "SingZ-$TAG-android.aab" --clobber

  # Play upload.
  #
  # A v* tag ships to the CLOSED testing track automatically — that is the
  # point of tagging, and testers should not wait on someone remembering to
  # press a button. Production is never automatic: it reaches strangers, a
  # staged rollout is a judgement call, and "git tag" is too easy to type.
  # Reaching production means dispatching this workflow and choosing it.
  #
  # The very first bundle for a package cannot come through here — the Play
  # Developer API cannot create an app entry and refuses a package it has never
  # seen. That upload is done by hand, once. See docs/ANDROID-RELEASE.md.
  # Hyphenated tags are prereleases (CLAUDE.md § Releasing) and must never
  # reach Play. Until now the only thing stopping them was that a -micN notes
  # file carries no store text, so sync_changelog died on a missing file —
  # an accident, not a refusal: writing those blocks would have uploaded a
  # prerelease to real testers. The convention is enforced here instead, the
  # same way the artifacts job already decides --prerelease.
  publish:
    if: >-
      (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-'))
      || github.event_name == 'workflow_dispatch'
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile/android

      - uses: actions/download-artifact@v4
        with:
          name: SingZ-android
          path: artifact

      # upload-artifact keeps the common ancestor of the paths it was given, so
      # the bundle arrives nested. Find it rather than hardcoding that shape.
      - name: Put the bundle where fastlane looks for it
        run: |
          AAB=$(find artifact -name '*.aab' | head -1)
          [ -n "$AAB" ] || { echo "::error::no .aab in the build artifact"; exit 1; }
          mkdir -p mobile/android/app/build/outputs/bundle/release
          cp "$AAB" mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Play
        working-directory: mobile/android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Deliberately no default here — the Fastfile owns it. This line used
          # to end in `|| 'alpha'`, which is a stock track nobody ever opened in
          # the console, so v0.15.0 uploaded its whole bundle and was then told
          # "Release in track targeting no countries". Two defaults for one
          # setting is one too many; set the repo variable to override.
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
          # fastlane refuses to run under a non-UTF-8 locale
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — see docs/ANDROID-RELEASE.md"
            exit 1
          fi
          # A tag always means the closed track. Only a hand-driven run gets to
          # pick, which is the whole reason production is not on this path.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            LANE=closed
          else
            LANE="${{ inputs.track }}"
          fi
          echo "publishing with lane: $LANE"
          bundle exec fastlane android "$LANE"
          if [ "${{ inputs.metadata }}" = "true" ]; then
            bundle exec fastlane android metadata
          fi
