name: Checks

# Nothing ran on an ordinary push or a pull request until this file. The desktop
# was not untested — build.yml runs typecheck and `npm test` on `v*` tags, on a
# manual dispatch and on the Monday cron, and e2e-win.yml runs the tests again
# on the `e2e-win` branch — but every one of those is armed deliberately, after the
# fact or by hand. Between them, a change could be written, reviewed and merged
# without a machine ever seeing it. The melody fix in 0da3a04 changed a
# detector, moved a version stamp every stored project depends on, and rewrote a
# parity gate; nothing checked it until a release was cut.
#
# The parity gates are the other half. Five of the six ran only when a human
# typed the command, and they are what holds the desktop's TypeScript detectors
# and the core's C++ to the same answer — which, now that the core is the source
# of truth, is the contract rather than a diagnostic.
#
# paths-ignore rather than paths, deliberately: an allow-list silently stops
# covering a source directory the day someone adds one, which is the failure
# mode this workflow exists to remove. Ignore only what cannot affect a test.
on:
  workflow_dispatch:
    inputs:
      perf_inject_frame_sleep_ms:
        description: 'Negative control for gpui-perf-smoke: sleep this many ms on every offscreen frame (0 = off). The perf job must go red.'
        required: false
        type: string
        default: '0'
  # Listed twice rather than shared through a YAML anchor: the Actions workflow
  # parser does not resolve anchors, and a workflow that silently fails to parse
  # is worse than a duplicated list.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  capture-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and load native capture addon in Electron
        run: |
          npm run capture:addon
          node_modules/.bin/electron tests/e2e/capture-addon-smoke.cjs --current-source
          node tests/e2e/capture-artifact-rebuild.cjs

      - name: Universal capture package merge and signature
        run: |
          # This job exercises capture packaging, not the unrelated downloaded
          # engines. Identical inert files satisfy extraResources without
          # pretending the analyzer itself was tested here.
          for target in darwin-arm64 darwin-x64; do
            mkdir -p "vendor/$target"
            printf '#!/bin/sh\nexit 1\n' > "vendor/$target/singz-analyze"
            printf 'capture-package-check\n' > "vendor/$target/singz-analyze.source-hash"
            chmod +x "vendor/$target/singz-analyze"
          done
          npm run dist -- --mac --universal --dir
          ADDON=dist/mac-universal/SingZ.app/Contents/Resources/engines/singz-capture.node
          lipo "$ADDON" -verify_arch x86_64 arm64
          node tests/e2e/capture-addon-signed-mac.cjs dist/mac-universal/SingZ.app

  capture-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and load the thin Intel capture addon in Electron
        run: |
          npm run capture:addon -- darwin-x64
          node_modules/.bin/electron tests/e2e/capture-addon-smoke.cjs build/capture-package/darwin-x64/singz-capture.node --current-source

  capture-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and load native capture addon in Electron
        # bash for fail-fast per line — default pwsh only reports the last
        # command's exit code.
        shell: bash
        run: |
          npm run capture:addon -- win32-x64
          node_modules/.bin/electron tests/e2e/capture-addon-smoke.cjs build/capture-package/win32-x64/singz-capture.node --current-source
          node tests/e2e/capture-artifact-rebuild.cjs win32-x64

      - name: Package and load-smoke win-unpacked
        shell: bash
        run: |
          mkdir -p vendor/win32-x64
          printf 'inert capture-package check\n' > vendor/win32-x64/singz-analyze
          printf 'capture-package-check\n' > vendor/win32-x64/singz-analyze.source-hash
          npm run dist -- --win --x64 --dir
          node_modules/.bin/electron tests/e2e/capture-addon-smoke.cjs dist/win-unpacked/resources/engines/singz-capture.node --current-source

  zdsp-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux native audio headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev pkg-config
      - name: Strict Release and sanitizer graph gates
        run: bash zdsp/run-sanitizer-gates.sh

  checks:
    # PINNED, not `ubuntu-latest`. courts-parity and courts-decide-parity compare
    # transcendentals (cos/sin/log2/log1p/hypot) and their own header says
    # bit-parity is a property of the platform's libm agreeing with V8 — which no
    # rule of ours enforces and no runner label promises. Measured green here on
    # Ubuntu 24.04 (glibc 2.39, g++ 13.3) before this landed, which is what earns
    # the blocking `run:` below. A moving label would turn an image bump into a
    # red push nobody changed anything to cause; this way it takes an edit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # melody-parity renders the sample's stems to WAV, and make-sample.js
      # synthesizes the sample itself, if this checkout has not got one.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ccache libasound2-dev libudev-dev pkg-config

      # The root postinstall generates the gdrive-config modules. Without the
      # secret they come out EMPTY, which is what the unit tests want — nothing
      # here talks to Drive (mock-drive.ts stands in for it).
      - run: npm ci

      # `mobile/src/gen/` is generated and gitignored, and the roundtrip suite
      # imports mobile sources (writer.ts, projects.ts) — so a job that
      # installs only the ROOT cannot resolve them, and the whole of `npm test`
      # went red on `Cannot find module './gen/graph-document'` the first time
      # this branch was pushed. It passes on a developer's Mac because a mobile
      # install has been run there at some point, which is exactly the class of
      # difference a clean runner exists to catch. The generator is a file copy
      # with a banner: no node_modules, no mobile install, ~10 ms.
      - name: Generate the mobile copy of the graph document
        run: node mobile/scripts/sync-graph-document.js

      # Same class, second file: the phone's i18n runs on gen/training-lib's
      # copy of the core, and the roundtrip suite imports mobile sources that
      # translate (publish.ts). The bundler falls back to the ROOT's esbuild
      # when mobile/node_modules is absent, so this too needs no mobile install.
      - name: Generate the mobile training bundle
        run: node mobile/scripts/build-training.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Compiler cache reuses Debug and Release objects across checkouts
        env:
          SINGZ_TEST_COMPILER_CACHE: '1'
        run: node scripts/with-native-build-lock.mjs --owner compiler-cache-regression -- node --test tests/tooling/compiler-cache.test.cjs

      # Six gates, ~45 s with the core built once. Measured green before this
      # landed on Ubuntu 24.04 (glibc 2.39, g++ 13.3) — the pinned runner — and
      # on Debian 12 (glibc 2.36, g++ 12.2) on both x86_64 and aarch64. If a
      # courts gate ever goes red here, read eval/courts-parity.mjs first: it may
      # be the platform talking rather than the port.
      - name: Parity gates (TypeScript against the C++ core)
        run: scripts/run-parity-gates.sh

  # The GPUI crate and its three native helpers had no CI at all (completion
  # plan C-04): `checks` above covers the Electron app and the C++ core, and
  # nothing built experiments/gpui-player on a push. It lives in this file, not
  # a new workflow, so it can never drift from the `on:` block and
  # `paths-ignore` list at the top, and shares the concurrency group.
  #
  # PINNED images, for the reason given on `checks`: macos-15 (arm64),
  # windows-2022 (the helper build asks CMake for the "Visual Studio 17 2022"
  # generator, which that image carries) and ubuntu-24.04. fail-fast is off so
  # one platform's red does not hide the other two.
  gpui-native:
    name: gpui-native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: macos-15 }
          - { name: windows, runner: windows-2022 }
          - { name: linux, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        # bash on every OS: fail-fast per line, and Windows' default pwsh only
        # reports the last command's exit code (see capture-windows).
        shell: bash
    env:
      G: experiments/gpui-player
      # No rust-toolchain file exists, so the toolchain is pinned here and in
      # the cache keys. Edition 2024 needs >= 1.85; this is what the crate is
      # developed against.
      RUST_TOOLCHAIN: '1.99.1'
      # Ordinary native builds allow at most four compile edges (AGENTS.md).
      # cargo reads this; the helper build gets --jobs 4.
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        timeout-minutes: 10
      # setup-python puts `python` on PATH on every OS (no python3 on Windows),
      # so the steps below spell it `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        timeout-minutes: 5
      # with-native-build-lock.mjs and the helper build's source hash use Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
        timeout-minutes: 5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libssl-dev libzstd-dev

      - name: Rust toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          cargo --version

      # Three caches, each keyed so that a change to the lockfile, the vendor
      # lock or a vendor patch MISSES:
      #  - vendor: exact key only. The tree is a build input, so a prefix
      #    fallback could hand back one that is stale; `--check` below would
      #    catch it, but a miss is cheaper than a failure. (Archives are also
      #    found in the cargo registry cache restored next.)
      #  - cargo home: the downloaded crates.
      #  - target: per-commit key, restored only from the SAME lock/patch
      #    hash, so cargo reuses compiled dependencies and rebuilds our crate.
      - name: Cache vendored GPUI crates
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: ${{ env.G }}/vendor
          key: gpui-vendor-${{ runner.os }}-${{ hashFiles('experiments/gpui-player/vendor-patches/**', 'scripts/gpui-vendor.py') }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-cargo-home-${{ runner.os }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/vendor.lock') }}
      - name: Cache cargo target
        uses: actions/cache@v4
        timeout-minutes: 15
        with:
          path: ${{ env.G }}/target
          key: gpui-target-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/**') }}-${{ github.sha }}
          restore-keys: gpui-target-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/**') }}-

      # The GPUI crates are not committed (AGENTS.md); this writes them to
      # $G/vendor, and --check proves no tree is missing, stale or hand-edited.
      - name: Materialize vendored GPUI crates
        timeout-minutes: 15
        run: |
          python scripts/gpui-vendor.py
          python scripts/gpui-vendor.py --check

      - name: Build (release)
        working-directory: ${{ env.G }}
        timeout-minutes: 40
        run: node ../../scripts/with-native-build-lock.mjs --owner ci-gpui-build -- cargo build --release --locked

      - name: Test
        working-directory: ${{ env.G }}
        timeout-minutes: 40
        run: node ../../scripts/with-native-build-lock.mjs --owner ci-gpui-test -- cargo test --locked

      # REPORTED, NOT YET BLOCKING. `cargo clippy --locked -- -D warnings` is
      # red today on all platforms checked (382 warnings in the bin plus the
      # build script's own; mostly collapsible_if, dead code and too_many_arguments),
      # so it runs without -D: the warnings appear in this step's log and a
      # real compile error still fails it. Once the crate is clean, add
      # `-- -D warnings` and this becomes a gate.
      - name: Clippy (reported, not failing on warnings)
        working-directory: ${{ env.G }}
        timeout-minutes: 40
        run: node ../../scripts/with-native-build-lock.mjs --owner ci-gpui-clippy -- cargo clippy --locked

      # --basic-only, deliberately: the LGPL FFmpeg codec pack is a from-source
      # FFmpeg build (scripts/build-ffmpeg-codec-runtime.sh, a bash/autotools
      # build that is long on Linux and needs an MSYS2 toolchain on Windows).
      # The helper build and the session tests below do not decode anything --
      # the tests configure SINGZ_ENABLE_FFMPEG_CODECS=OFF and use synthesized
      # audio -- so the pack adds minutes and a failure mode without adding
      # coverage of the code this job is about. The pack has its own gates
      # (prove-ffmpeg-codec-runtime.mjs, verify-ffmpeg-codec-pack.mjs). What this
      # leaves unchecked is the codec-enabled link of the helpers (WAV/FLAC/MP3
      # only here); that belongs to the release pipeline (C-34), which builds
      # the pack anyway.
      - name: Build the three native helpers (basic codecs)
        timeout-minutes: 45
        run: python scripts/build-gpui-native.py --basic-only --jobs 4 --output-dir "$G/target/ci-helpers"

      # build-gpui-native.py configures SINGZ_CORE_TESTS=OFF, so its build tree
      # has no ctest targets. The helpers' session tests (D-07, C-80a) are
      # native_playback_session_tests (the playback session singz-gpui-audio
      # drives, with its three failure-mode runs) and shared_audio_service_tests
      # (the service singz-gpui-input shares), plus the cue-plan and contract
      # tests that read the same session. A second, tests-on configure builds
      # only those targets.
      - name: Helper session tests (ctest)
        timeout-minutes: 30
        run: |
          cmake -S . -B build/native/gpui-session-tests \
            -DSINGZ_BUILD_ELECTRON_CAPTURE=OFF -DSINGZ_ENABLE_FFMPEG_CODECS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/gpui-session-tests --config Release --parallel 4 \
            --target native_playback_session_tests shared_audio_service_tests \
            playback_cue_plan_tests native_playback_contract_tests
          ctest --test-dir build/native/gpui-session-tests -C Release --output-on-failure \
            -R '^(native_playback_|shared_audio_service_tests|playback_cue_plan_tests)'

      # The perf smoke job below needs the audio helper the app talks to; it is
      # built above, once, so the perf job does not repeat a C++ build.
      - name: Keep the macOS helpers for the perf smoke job
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: gpui-ci-helpers
          path: ${{ env.G }}/target/ci-helpers
          retention-days: 1
          if-no-files-found: error

  # C-35: the plan's section 3.3 smoke checks on a release ui-tests build, on
  # macOS (the only platform with a hidden-window driver and the allocation and
  # frame-demand counters). A regression fails the job and prints its delta; the
  # limits and why each one is gated or only reported are in
  # tests/perf/smoke_thresholds.json and tests/perf/README.md. It reuses the
  # vendor, registry and target caches of gpui-native (the target cache by prefix:
  # same toolchain, lockfile and patches, so dependencies are not rebuilt; only
  # the ui-tests build of our own crate is) and the helpers gpui-native built.
  # Runs on every push, a superset of "pushes touching the GPUI crate or the helpers".
  gpui-perf-smoke:
    name: gpui-perf-smoke (macos)
    needs: gpui-native
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      G: experiments/gpui-player
      RUST_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '4'
      # Empty or 0 outside a manual dispatch. Only the ui-tests build reads it.
      SINGZ_PERF_INJECT_FRAME_SLEEP_MS: ${{ inputs.perf_inject_frame_sleep_ms }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        timeout-minutes: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
        timeout-minutes: 5
      # make_reference.cjs synthesizes the Q-02 reference library with ffmpeg
      # (FLAC and MP3 encoders); the runner image does not carry it.
      - name: ffmpeg
        timeout-minutes: 10
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      - name: Rust toolchain
        timeout-minutes: 10
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
      - name: Cache vendored GPUI crates
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: ${{ env.G }}/vendor
          key: gpui-vendor-${{ runner.os }}-${{ hashFiles('experiments/gpui-player/vendor-patches/**', 'scripts/gpui-vendor.py') }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: gpui-cargo-home-${{ runner.os }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/vendor.lock') }}
      # Own key (gpui-native saves the gpui-target- key for this sha, and a
      # second save to the same key is refused); restored from gpui-native's.
      - name: Cache cargo target
        uses: actions/cache@v4
        timeout-minutes: 15
        with:
          path: ${{ env.G }}/target
          key: gpui-perf-target-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/**') }}-${{ github.sha }}
          restore-keys: |
            gpui-target-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/**') }}-
            gpui-perf-target-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('experiments/gpui-player/Cargo.lock', 'experiments/gpui-player/vendor-patches/**') }}-
      - name: Materialize vendored GPUI crates
        timeout-minutes: 15
        run: |
          python scripts/gpui-vendor.py
          python scripts/gpui-vendor.py --check
      - name: Build (release, ui-tests)
        working-directory: ${{ env.G }}
        timeout-minutes: 40
        run: node ../../scripts/with-native-build-lock.mjs --owner ci-gpui-perf-build -- cargo build --release --locked --features ui-tests
      - name: Helpers from gpui-native
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: gpui-ci-helpers
          path: ${{ runner.temp }}/helpers
      - name: Perf gate unit tests
        timeout-minutes: 5
        run: python -m unittest tests/perf/test_smoke_gate.py
      # Exit status is the gate: non-zero prints the REGRESSION lines and fails the job.
      - name: Perf smoke gate
        timeout-minutes: 20
        run: |
          chmod +x "$RUNNER_TEMP"/helpers/*
          python tests/perf/smoke_gate.py \
            --binary "$G/target/release/singz-gpui-player" \
            --helpers "$RUNNER_TEMP/helpers" \
            --out-dir "$RUNNER_TEMP/perf-smoke"
      - name: Keep the perf receipts
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: gpui-perf-smoke
          path: ${{ runner.temp }}/perf-smoke
          retention-days: 14
          if-no-files-found: warn
