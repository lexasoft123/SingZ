appId: com.lexasoft.singz
productName: SingZ
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!build/*'
  - '!vendor/*'
  - '!.engines-src/*'
  # The native source trees ship as compiled engines (extraResources), never
  # as source in the asar — the negation-only list means everything not
  # negated here IS packaged.
  - '!zcore/*'
  - '!zdsp/*'
  - '!third_party/*'
  - '!tools/*'
  - '!native/*'
  - '!cmake/*'
  - '!{CMakeLists.txt,CMakePresets.json}'
  # Pre-existing instances of the same trap (the phone app's whole source
  # tree — plus its node_modules on any machine that ran mobile npm ci —
  # the test suites, and the agent config all shipped inside the asar).
  - '!mobile/*'
  - '!tests/*'
  - '!.claude/*'
  - '!{CLAUDE.md,vitest.config.ts,tsconfig.tests.json}'
  - '!scripts/*'
  - '!docs/*'
  - '!eval/*'
  - '!.local/*'
  - '!.github/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{.gitignore,README.md,CHANGELOG.md,dev-app-update.yml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
asar: true
npmRebuild: false
afterPack: scripts/afterPack.cjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Update metadata (latest*.yml + blockmaps) for the in-app updater; the CI
# attach step uploads them, electron-builder itself never publishes.
publish:
  provider: github
  owner: lexasoft123
  repo: SingZ
mac:
  # No Developer ID is wired up yet; afterPack applies an ad-hoc fallback.
  # To sign for release: remove `identity`, add CSC_LINK/CSC_KEY_PASSWORD; the
  # later electron-builder signing pass replaces the fallback signature.
  identity: null
  category: public.app-category.music
  darkModeSupport: true
  # Universal packaging receives the same already-lipo'd capture addon in
  # both thin staging apps; do not attempt to merge that binary a second time.
  x64ArchFiles: '**/engines/singz-capture.node'
  extendInfo:
    NSMicrophoneUsageDescription: SingZ listens to your singing to show how well you match the melody.
  extraResources:
    - from: vendor/darwin-${arch}
      to: engines
      filter: ['whisper-cli*', 'singz-analyze*']
    - from: build/capture-package/darwin-${arch}
      to: engines
      filter: ['singz-capture.node', 'singz-capture.node.source-hash', 'singz-capture.node.sha256', 'singz-capture.manifest.json']
  target:
    - target: dmg
dmg:
  title: ${productName}
win:
  extraResources:
    - from: vendor/win32-x64
      to: engines
      filter: ['whisper-cli*', 'singz-analyze*']
    - from: build/capture-package/win32-x64
      to: engines
      filter: ['singz-capture.node', 'singz-capture.node.source-hash', 'singz-capture.node.sha256', 'singz-capture.manifest.json']
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
