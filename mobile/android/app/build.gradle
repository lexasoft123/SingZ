apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * One version for the whole product: the desktop package.json is the source of
 * truth, so a v0.14.0 tag ships a dmg, an installer and an AAB that agree.
 * Play needs a strictly increasing integer, so the name is folded into one:
 * 0.14.0 -> 1400 (minor and patch each get two digits).
 *
 * SINGZ_VERSION_CODE overrides it for the one case the formula cannot serve —
 * re-uploading a build under a version Play has already seen (a rejected
 * submission, a corrected bundle). Play refuses a versionCode twice.
 */
def pkg = new groovy.json.JsonSlurper().parse(file("../../../package.json"))
def singzAndroidCmakeInit = rootProject.file("../scripts/android-cmake-init.cmake")
def singzAndroidCmakePolicyDigest = java.security.MessageDigest.getInstance("SHA-256")
[
    singzAndroidCmakeInit,
    rootProject.file("../scripts/android-ccache-launcher.sh"),
    rootProject.file("../scripts/android-ccache-launcher.ps1")
].each { policyFile -> singzAndroidCmakePolicyDigest.update(policyFile.bytes) }
def singzAndroidCmakePolicyHash = singzAndroidCmakePolicyDigest.digest()
    .encodeHex().toString().take(16)
def semver = (pkg.version =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!semver.find()) {
    throw new GradleException("package.json version '${pkg.version}' is not major.minor.patch")
}
def singzVersionName = pkg.version
def singzVersionCode = System.getenv('SINGZ_VERSION_CODE')?.toInteger() ?:
    (semver.group(1).toInteger() * 10000 +
     semver.group(2).toInteger() * 100 +
     semver.group(3).toInteger())
def singzCodecTargetProof = project.findProperty('singzCodecTargetProof') == 'true'
def singzSupportedCodecAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
def singzShippingCodecAbis = (project.findProperty('reactNativeArchitectures') ?:
    'armeabi-v7a,arm64-v8a').toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
if (singzShippingCodecAbis.isEmpty() ||
    singzShippingCodecAbis.toSet().size() != singzShippingCodecAbis.size() ||
    !singzSupportedCodecAbis.containsAll(singzShippingCodecAbis)) {
    throw new GradleException(
        "reactNativeArchitectures must be a non-empty unique subset of ${singzSupportedCodecAbis}; " +
        "got ${singzShippingCodecAbis}")
}
if (singzCodecTargetProof && singzShippingCodecAbis.size() != 1) {
    throw new GradleException(
        "-PsingzCodecTargetProof=true requires exactly one reactNativeArchitectures ABI; " +
        "got ${singzShippingCodecAbis}")
}

gradle.taskGraph.whenReady { graph ->
    if (singzCodecTargetProof && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException(
            'Codec target-proof staging is configuration-only and can never enter a Release APK/AAB')
    }
}

/**
 * Release signing. The upload key never lives in the repo: locally it comes
 * from android/keystore.properties (gitignored), in CI from the environment.
 * With neither, a release build falls back to the debug key so a developer can
 * still assembleRelease for a sideload — but that build is NOT shippable, and
 * the warning below says so, because Play rejects a debug-signed upload with a
 * message that does not mention which key it objected to.
 */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def uploadStore = keystoreProps['storeFile'] ?: System.getenv('SINGZ_KEYSTORE_FILE')
def uploadStorePassword = keystoreProps['storePassword'] ?: System.getenv('SINGZ_KEYSTORE_PASSWORD')
def uploadKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('SINGZ_KEY_ALIAS')
def uploadKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('SINGZ_KEY_PASSWORD')
def hasUploadKey = uploadStore && rootProject.file(uploadStore).exists() &&
    uploadStorePassword && uploadKeyAlias && uploadKeyPassword

if (!hasUploadKey) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
            logger.warn(
                "\n  SingZ: no upload key — this release build is signed with the DEBUG key.\n" +
                "         Google Play will reject it. See docs/ANDROID-RELEASE.md.\n")
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.singzplayer"
    defaultConfig {
        applicationId "com.lexasoft.singz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode singzVersionCode
        versionName singzVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The selected product runtime and the APK ABI set are one policy.
        // An ABI omitted here cannot be smuggled in by a stale jniLibs copy;
        // every ABI included here is required by the strict selector below.
        ndk {
            abiFilters(*singzShippingCodecAbis)
        }
        externalNativeBuild {
            cmake {
                // Repeat the root-project injection here because AGP treats a
                // later arguments(...) call as replacement for the app's
                // earlier defaultConfig value. Library modules retain the
                // root injection directly.
                arguments "-DORT_SDK_DIR=${layout.buildDirectory.get().asFile}/ort-sdk",
                    "-DCMAKE_PROJECT_INCLUDE_BEFORE=${singzAndroidCmakeInit.absolutePath}",
                    "-DSINGZ_ANDROID_NATIVE_MAX_JOBS=8",
                    "-DSINGZ_ANDROID_BUILD_POLICY_HASH=${singzAndroidCmakePolicyHash}",
                    "-DSINGZ_CODEC_TARGET_PROOF=${singzCodecTargetProof ? 'ON' : 'OFF'}",
                    // The debug variant optimizes the app's own native code
                    // (src/main/cpp/CMakeLists.txt says why); this is the
                    // opt-out for stepping through the core in a debugger.
                    "-DSINGZ_NATIVE_UNOPTIMIZED=${project.hasProperty('singzNativeUnoptimized') ? 'ON' : 'OFF'}"
            }
        }
    }

    // libsingzcore: the JNI binding over the root zcore component targets —
    // split engine + Beat This runner + FLAC encode, shared with iOS/desktop
    // (docs/PHONE-STANDALONE.md). The ORT AAR is legacy-layout (headers/ +
    // jni/<abi>/libonnxruntime.so, no prefab), so extractOrtSdk below unpacks
    // it and CMake imports the .so per ABI; the APK's copy still comes from
    // the ordinary implementation dependency.
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    // Oboe ships its headers and .so as a prefab package, which is how the
    // core links it. liboboe.so is already in the APK — react-native-audio-api
    // depends on the same artifact for playback — so this adds no download.
    buildFeatures {
        prefab true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile rootProject.file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // OPT-IN side-by-side install: -PdebugAppIdSuffix=.debug gives the
            // debug build its own applicationId so it can sit next to a
            // RELEASE build on the same phone. Without it, debug and release
            // share com.lexasoft.singz with different signing keys, so
            // installing one over the other forces an uninstall — which takes
            // files/singz-projects (every downloaded song) and the Drive
            // sign-in with it. That is why this exists: it is the only safe
            // way to drive a dev build on a phone that is somebody's daily
            // player. Default is empty, so CI, the emulator and every driver
            // that hardcodes the package are unaffected.
            if (project.hasProperty('debugAppIdSuffix')) {
                applicationIdSuffix project.property('debugAppIdSuffix')
            }
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// The ORT AAR again, as its own configuration, so extractOrtSdk can unzip the
// exact artifact the app links — headers and the imported .so can never come
// from a different ORT version than the APK ships.
configurations {
    ortAar
}

tasks.register("extractOrtSdk", Copy) {
    from({ zipTree(configurations.ortAar.singleFile) }) {
        include "headers/**", "jni/**"
    }
    into layout.buildDirectory.dir("ort-sdk")
}
preBuild.dependsOn("extractOrtSdk")

tasks.register("selectFfmpegCodecRuntime", Exec) {
    workingDir file("../../..")
    def arguments = [
        "mobile/scripts/select-ffmpeg-codec-runtime.mjs",
        "--require-android-set", singzShippingCodecAbis.join(',')
    ]
    if (singzCodecTargetProof) {
        arguments.add("--proof-staging")
        environment "SINGZ_CODEC_TARGET_PROOF", "1"
    }
    commandLine "node", *arguments
}
tasks.register("verifyFfmpegCodecRuntime", Exec) {
    workingDir file("../../..")
    def arguments = [
        "mobile/scripts/verify-ffmpeg-codec-runtime.mjs",
        "--require-android-set", singzShippingCodecAbis.join(',')
    ]
    if (singzCodecTargetProof) {
        arguments.add("--proof-staging")
        environment "SINGZ_CODEC_TARGET_PROOF", "1"
    } else {
        arguments.add("--require-full")
    }
    commandLine "node", *arguments
    dependsOn("selectFfmpegCodecRuntime")
}
preBuild.dependsOn("verifyFfmpegCodecRuntime")

def ffmpegNoticeAssets = layout.buildDirectory.dir("generated/ffmpeg-notice-assets")
tasks.register("prepareFfmpegNoticeAssets", Copy) {
    dependsOn("verifyFfmpegCodecRuntime")
    from(file("../../../third_party")) {
        include "NOTICE-FFMPEG.md"
        include "COPYING.LGPLv2.1-FFMPEG"
        include "FFMPEG-SHA256SUMS"
    }
    from(file("../../../third_party/ffmpeg-codec")) {
        include "profile.json"
    }
    from(file("../../node_modules/react-native-audio-api/common/cpp/audioapi/external")) {
        include "singz-ffmpeg-selection.json"
    }
    into(ffmpegNoticeAssets.map { it.dir("third_party/ffmpeg") })
}
android.sourceSets.main.assets.srcDir(ffmpegNoticeAssets)
preBuild.dependsOn("prepareFfmpegNoticeAssets")

// The corpus belongs only to the instrumentation APK. Normal debug/release
// product APKs contain neither these files nor the conditionally compiled
// proof runner.
android.sourceSets.androidTest.assets.srcDir(file("../../../tests/fixtures/codecs/data"))

def signalsmithNoticeAssets = layout.buildDirectory.dir("generated/signalsmith-notice-assets")
tasks.register("prepareSignalsmithNoticeAssets", Copy) {
    from(file("../../../third_party/native/signalsmith")) {
        include "VENDORED.txt"
        include "LICENSE-stretch.txt"
        include "LICENSE-linear.txt"
    }
    into(signalsmithNoticeAssets.map { it.dir("third_party/signalsmith") })
}
android.sourceSets.main.assets.srcDir(signalsmithNoticeAssets)
preBuild.dependsOn("prepareSignalsmithNoticeAssets")

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // JVM unit tests: the cache-currency rule is checked against the same
    // table TypeScript and Swift run (tests/shared/currency-cases.json)
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    // Oboe: Google's AAudio wrapper, used by the core's Android capture
    // backend. The version is pinned to the one react-native-audio-api already
    // pulls in, so the APK carries exactly one liboboe.so. Its value here is
    // QuirksManager — the device database that knows, for instance, that some
    // Exynos 9810 builds record SILENCE on the MMAP + non-VoiceCommunication
    // combination our hand-rolled AAudio ladder used to try first.
    implementation("com.google.oboe:oboe:1.9.3")
    // ONNX Runtime for the C++ core (same version the desktop packs pin)
    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.23.2")
    ortAar("com.microsoft.onnxruntime:onnxruntime-android:1.23.2")
    // SAF folder trees (picked project roots, incl. Google Drive)
    implementation("androidx.documentfile:documentfile:1.0.1")
    // Custom Tabs: Google consent inside the app's own task (self-closing)
    implementation("androidx.browser:browser:1.8.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
